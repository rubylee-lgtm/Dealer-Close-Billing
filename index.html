  <body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
      const { useEffect, useMemo, useState } = React;

      /** 與 head 內 app-version meta、初始 title 字串請保持一致 */
      const APP_VERSION = "0.4.0";

      const PARTIAL_LEDGER_KEY = "dealer-partial-settlement-v1";

      function loadPartialLedger() {
        try {
          const s = localStorage.getItem(PARTIAL_LEDGER_KEY);
          if (!s) return {};
          const o = JSON.parse(s);
          return o && typeof o === "object" ? o : {};
        } catch {
          return {};
        }
      }

      function savePartialLedger(map) {
        try {
          localStorage.setItem(PARTIAL_LEDGER_KEY, JSON.stringify(map || {}));
        } catch {
          // ignore quota / private mode
        }
      }

      /** 出貨明細積分鍵：通路 + 單號 + SKU + 出貨日 + 單據類型 */
      function settlementLineKey(r) {
        const t = normalizeDocType(r?.docType);
        const ch = String(r?.channelShort || "").trim();
        const doc = String(r?.docNo || "").trim();
        const sku = String(r?.sku || "").trim();
        const d = String(r?.shipDateISO || "").trim();
        if (!doc || !sku) return "";
        return `${ch}|${doc}|${sku}|${d}|${t}`;
      }

      function ledgerSettledQty(key) {
        if (!key) return 0;
        return Math.max(0, safeNumber(loadPartialLedger()[key]));
      }

      /** 依目前 ledger 寫回：originalQty、priorSettledQty、availableQty、settlementKey */
      function applyPartialFieldsToRow(r) {
        const t = normalizeDocType(r.docType);
        const originalQty = Math.max(0, safeNumber(r.originalQty != null ? r.originalQty : r.qty));
        const base = { ...r, originalQty };
        if (t !== "出貨" && t !== "退貨") {
          return {
            ...base,
            settlementKey: "",
            priorSettledQty: 0,
            availableQty: originalQty,
          };
        }
        const key = settlementLineKey(base);
        const prior = key ? ledgerSettledQty(key) : 0;
        const availableQty = Math.max(0, originalQty - prior);
        return {
          ...base,
          settlementKey: key,
          priorSettledQty: prior,
          availableQty,
        };
      }

      function partialSettlementStatusLabel(r) {
        const t = normalizeDocType(r.docType);
        if (t !== "出貨" && t !== "退貨") return "—";
        const o = safeNumber(r.originalQty);
        const a = safeNumber(r.availableQty);
        const p = safeNumber(r.priorSettledQty);
        if (o <= 0) return "—";
        if (a <= 0) return "已全部結算";
        if (p > 0) return "部分結算";
        return "未結算";
      }

      /** 將本次結算數量寫入 ledger（出貨/退貨列）；priorSettledQty 須為匯入當下之歷史已結算 */
      function commitPartialSettlementLines(lines) {
        const ledger = loadPartialLedger();
        let touched = false;
        for (const r of lines || []) {
          const t = normalizeDocType(r.docType);
          if (t !== "出貨" && t !== "退貨") continue;
          const key = r.settlementKey;
          if (!key) continue;
          const o = Math.max(0, safeNumber(r.originalQty));
          const prior = Math.max(0, safeNumber(r.priorSettledQty));
          const q = Math.abs(safeNumber(r.qty));
          if (q <= 0) continue;
          const next = Math.min(o, prior + q);
          if (safeNumber(ledger[key]) !== next) {
            ledger[key] = next;
            touched = true;
          }
        }
        if (touched) savePartialLedger(ledger);
      }

      /** 同 settlementKey 的出貨/退貨列合併數量（單價取首列） */
      function mergeShipmentRowsByKey(rows) {
        const buckets = new Map();
        const order = [];
        for (const r of rows || []) {
          const t = normalizeDocType(r.docType);
          if (t !== "出貨" && t !== "退貨") {
            order.push({ kind: "one", r });
            continue;
          }
          const k = settlementLineKey(r);
          if (!k) {
            order.push({ kind: "one", r });
            continue;
          }
          if (!buckets.has(k)) {
            buckets.set(k, { merged: null });
            order.push({ kind: "key", k });
          }
          const b = buckets.get(k);
          const q = Math.abs(safeNumber(r.qty));
          if (!b.merged) {
            b.merged = {
              ...r,
              qty: q,
              originalQty: q,
              lineAmount: Math.abs(safeNumber(r.unitPrice)) * q,
            };
          } else {
            const add = q;
            const nq = Math.abs(safeNumber(b.merged.qty)) + add;
            b.merged.qty = nq;
            b.merged.originalQty = nq;
            b.merged.lineAmount = Math.abs(safeNumber(b.merged.unitPrice)) * nq;
          }
        }
        const out = [];
        for (const item of order) {
          if (item.kind === "one") out.push(item.r);
          else {
            const m = buckets.get(item.k)?.merged;
            if (m) out.push(m);
          }
        }
        return out;
      }

      function safeNumber(v) {
        if (v === null || v === undefined) return 0;
        if (typeof v === "number") return Number.isFinite(v) ? v : 0;
        const s = String(v).trim();
        if (!s) return 0;
        const cleaned0 = s
          .replaceAll(",", "")
          .replaceAll("$", "")
          .replaceAll("NT$", "")
          .replaceAll("＄", "")
          .replaceAll("　", " ")
          .trim();
        // 支援像 "--70,272" 這種匯出格式
        const cleaned = cleaned0.replace(/^--+/, "-");
        const n = Number(cleaned);
        return Number.isFinite(n) ? n : 0;
      }

      function normalizeDocType(v) {
        const s = String(v || "").trim();
        if (!s) return "";
        if (s.includes("退")) return "退貨";
        if (s.includes("出")) return "出貨";
        return s;
      }

      // 盡量把各種日期字串轉成 YYYY-MM-DD（用於篩選比較）
      function toISODateMaybe(v) {
        if (!v) return "";
        if (v instanceof Date) {
          const yyyy = v.getFullYear();
          const mm = String(v.getMonth() + 1).padStart(2, "0");
          const dd = String(v.getDate()).padStart(2, "0");
          return `${yyyy}-${mm}-${dd}`;
        }
        const s = String(v).trim();
        if (!s) return "";
        if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
        if (/^\d{4}\/\d{1,2}\/\d{1,2}$/.test(s)) {
          const [y, m, d] = s.split("/");
          return `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
        }
        if (/^\d{4}\.\d{1,2}\.\d{1,2}$/.test(s)) {
          const [y, m, d] = s.split(".");
          return `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
        }
        // Excel date serial number (rough support)
        const n = Number(s);
        if (Number.isFinite(n) && n > 20000 && n < 90000) {
          const epoch = new Date(Date.UTC(1899, 11, 30));
          const d = new Date(epoch.getTime() + n * 86400000);
          return toISODateMaybe(d);
        }
        const d = new Date(s);
        if (!Number.isNaN(d.getTime())) return toISODateMaybe(d);
        return "";
      }

      // Prototype：對帳草稿／列表不持久化（刷新即清空）；重新整理時也會清除部分結算累計（PARTIAL_LEDGER_KEY）

      function genReconcileId() {
        const d = new Date();
        const y = String(d.getFullYear()).slice(2);
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const dd = String(d.getDate()).padStart(2, "0");
        const rand = Math.floor(Math.random() * 900 + 100);
        return `DAS-${y}${m}${dd}-${rand}`;
      }

      function Icon({ name, className }) {
        useEffect(() => {
          if (window.lucide && typeof window.lucide.createIcons === "function") {
            window.lucide.createIcons();
          }
        });
        return <i data-lucide={name} className={className} />;
      }

      function formatMoney(n) {
        const v = Number(n || 0);
        return (
          "$" +
          v.toLocaleString("en-US", {
            maximumFractionDigits: 0,
          })
        );
      }

      function todayISO() {
        const d = new Date();
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, "0");
        const dd = String(d.getDate()).padStart(2, "0");
        return `${yyyy}-${mm}-${dd}`;
      }

      function genInvoiceNo(seedIndex) {
        const base = 88293011;
        return `TK-${String(base + seedIndex).padStart(8, "0")}`;
      }

      /** 依明細列（含可編輯單價/數量）彙總為 SKU 小計；Step2 / Step3 共用 */
      function computeSubtotalsFromLines(lines) {
        const map = new Map(); // key = sku
        for (const r of lines || []) {
          const sku = r.sku || "";
          if (!sku) continue;
          const docType = normalizeDocType(r.docType);
          const qty = safeNumber(r.qty);
          const amt = Math.abs(safeNumber(r.unitPrice)) * Math.abs(qty);
          const prev = map.get(sku) || {
            sku,
            skuName: r.skuName || "",
            channelShort: r.channelShort || "",
            unitPrice: safeNumber(r.unitPrice),
            shipQty: 0,
            returnQty: 0,
            shipAmount: 0,
            returnAmount: 0,
            remark: "",
          };
          if (!prev.skuName && r.skuName) prev.skuName = r.skuName;
          if (!prev.channelShort && r.channelShort) prev.channelShort = r.channelShort;
          if (!prev.unitPrice && safeNumber(r.unitPrice)) prev.unitPrice = safeNumber(r.unitPrice);
          const isReturn = docType === "退貨" || qty < 0 || amt < 0;
          if (isReturn) {
            prev.returnQty += Math.abs(qty);
            prev.returnAmount += Math.abs(amt);
          } else {
            prev.shipQty += Math.abs(qty);
            prev.shipAmount += Math.abs(amt);
          }
          map.set(sku, prev);
        }
        const out = Array.from(map.values()).map((r) => ({
          ...r,
          netQty: safeNumber(r.shipQty) - safeNumber(r.returnQty),
          netAmount: safeNumber(r.shipAmount) - safeNumber(r.returnAmount),
          confirmed: false,
        }));
        out.sort((a, b) => a.sku.localeCompare(b.sku, "en"));
        return out;
      }

      function App() {
        const [currentView, setCurrentView] = useState("settling"); // 'settling' | 'settled' | 'closed'
        const [isProcessing, setIsProcessing] = useState(false);
        const [showSuccessToast, setShowSuccessToast] = useState(false);

        const [settlingDoc, setSettlingDoc] = useState(() => ({
          id: genReconcileId(),
          channel: "",
          issuer: "財務部 - 王大明",
          notifyEmail: "",
          purchaseTotal: 0,
          returnTotal: 0,
          deductions: 0,
          adjustments: [], // { id, label, amount }
          note: "",
          invoiceDate: todayISO(),
          invoiceNo: "",
          periodStart: "",
          periodEnd: "",
        }));

        // Step 1/2 資料（純前端匯入）
        const [importState, setImportState] = useState(() => ({
          fileName: "",
          importedAt: "",
          rawLines: [], // normalized lines (each has _id)
          filter: {
            channelShort: "",
            shipStart: "",
            shipEnd: "",
            q: "",
            docTypes: [], // ["出貨","退貨"]
            docNos: [], // multi-select
            hideFullySettled: true,
          },
          selectedIds: [], // Step2 selected rows
          settleLines: [], // Step3 editable lines (same columns as Step2)
          subtotals: [], // Step3 subtotal rows
          confirmed: false, // Step3 confirmed (lock subtotal editing)
        }));

        const netAmount = useMemo(() => {
          const adjSum = (settlingDoc.adjustments || []).reduce((acc, a) => acc + safeNumber(a?.amountText ?? a?.amount), 0);
          return (
            (settlingDoc.purchaseTotal || 0) -
            (settlingDoc.returnTotal || 0) -
            (settlingDoc.deductions || 0) +
            adjSum
          );
        }, [settlingDoc.purchaseTotal, settlingDoc.returnTotal, settlingDoc.deductions, settlingDoc.adjustments]);

        const [settledList, setSettledList] = useState(() => []);

        const [closedDoc, setClosedDoc] = useState(() => ({
          id: "ST-2603000",
          channel: "直營店-北區門市",
          periodStart: "2026-03-01",
          periodEnd: "2026-03-15",
          shipDateRange: "2026/03/01 - 2026/03/15",
          invoiceNo: genInvoiceNo(-1),
          invoiceDate: "2026-03-18",
          issuer: "王大明",
          status: "結案 (鎖定)",
          purchaseTotal: 170000,
          returnTotal: 30000,
          deductions: 14600,
          netAmount: 125400,
          memo: "已回壓 ERP / 已寄送通路商對帳單",
          subtotals: [
            {
              channel: "直營店-北區門市",
              sku: "SKU-10023",
              skuName: "益生菌膠囊 30粒",
              shipQty: 120,
              returnQty: 10,
              netQty: 110,
              shipAmount: 96000,
              returnAmount: 8000,
              netAmount: 88000,
              remark: "已確認",
            },
            {
              channel: "直營店-北區門市",
              sku: "SKU-20011",
              skuName: "維他命C 60錠",
              shipQty: 150,
              returnQty: 25,
              netQty: 125,
              shipAmount: 74000,
              returnAmount: 22000,
              netAmount: 52000,
              remark: "已確認",
            },
          ],
          rawLines: [
            {
              docType: "出貨",
              docNo: "SO-2603-00121",
              channelShort: "北區門市",
              channel: "直營店-北區門市",
              shipDate: "2026/03/02",
              inDate: "2026/03/03",
              sku: "SKU-10023",
              skuName: "益生菌膠囊 30粒",
              unitPrice: 800,
              qty: 60,
              lineAmount: 48000,
            },
            {
              docType: "出貨",
              docNo: "SO-2603-00155",
              channelShort: "北區門市",
              channel: "直營店-北區門市",
              shipDate: "2026/03/08",
              inDate: "2026/03/09",
              sku: "SKU-10023",
              skuName: "益生菌膠囊 30粒",
              unitPrice: 800,
              qty: 60,
              lineAmount: 48000,
            },
            {
              docType: "退貨",
              docNo: "RT-2603-00009",
              channelShort: "北區門市",
              channel: "直營店-北區門市",
              shipDate: "2026/03/10",
              inDate: "2026/03/11",
              sku: "SKU-10023",
              skuName: "益生菌膠囊 30粒",
              unitPrice: 800,
              qty: 10,
              lineAmount: 8000,
            },
          ],
        }));

        const handleSaveDraft = (payload) => {
          if (payload?.rawLines?.length) {
            commitPartialSettlementLines(payload.rawLines);
          }
          setImportState((prev) => ({
            ...prev,
            rawLines: (prev.rawLines || []).map((r) => applyPartialFieldsToRow(r)),
            selectedIds: [],
            settleLines: [],
            subtotals: [],
            confirmed: false,
          }));
          setIsProcessing(true);
          setTimeout(() => {
            const dateISO = settlingDoc.invoiceDate || todayISO();
            const dateHuman = dateISO.replaceAll("-", "/");

            const settledRow = {
              id: settlingDoc.id,
              channel: settlingDoc.channel,
              amount: netAmount,
              invoiceNo: "",
              date: dateHuman,
              issuer: settlingDoc.issuer.replace("財務部 - ", ""),
              status: "草稿",
              payload: payload || null, // { rawLines, subtotals, periodStart, periodEnd }
              notifyEmail: settlingDoc.notifyEmail || "",
              adjustments: settlingDoc.adjustments || [],
              deductions: safeNumber(settlingDoc.deductions),
              note: settlingDoc.note || "",
              invoiceDateISO: dateISO,
            };

            setSettledList((prev) => [settledRow, ...prev]);

            setIsProcessing(false);
            setCurrentView("settled");
            setShowSuccessToast(true);
            setTimeout(() => setShowSuccessToast(false), 3000);
          }, 900);
        };

        const issueInvoiceForId = (id) => {
          const row = settledList.find((x) => x.id === id);
          if (!row) return;
          if (row.status !== "草稿") return;

          const issuedNo = genInvoiceNo(settledList.length + 1);
          const dateISO = row?.invoiceDateISO || todayISO();
          const dateHuman = dateISO.replaceAll("-", "/");

          setSettledList((prev) =>
            prev.map((r) =>
              r.id === id
                ? {
                    ...r,
                    invoiceNo: issuedNo,
                    date: dateHuman,
                    status: "已開立",
                  }
                : r
            )
          );

          const p = row.payload || {};
            setClosedDoc((prev) => ({
              ...prev,
            id: row.id,
            channel: row.channel,
              invoiceNo: issuedNo,
              invoiceDate: dateISO,
            issuer: row.issuer,
            deductions: safeNumber(row.deductions),
            netAmount: row.amount,
            memo: row.note ? `備註：${row.note}` : prev.memo,
              status: "結案 (鎖定)",
            subtotals: p.subtotals || prev.subtotals,
            rawLines: p.rawLines || prev.rawLines,
            periodStart: p.periodStart || prev.periodStart,
            periodEnd: p.periodEnd || prev.periodEnd,
            shipDateRange:
              p.periodStart && p.periodEnd
                ? `${p.periodStart.replaceAll("-", "/")} - ${p.periodEnd.replaceAll("-", "/")}`
                : prev.shipDateRange,
          }));

            setCurrentView("closed");
        };

        useEffect(() => {
          // 重新整理會重置所有單據狀態（部分結算累計也一併清除）
          try {
            localStorage.removeItem(PARTIAL_LEDGER_KEY);
          } catch {
            // ignore
          }
          document.title = `出退貨請款與發票系統 Prototype v${APP_VERSION}`;
        }, []);

        useEffect(() => {
          const onMsg = (evt) => {
            const data = evt?.data;
            if (!data || typeof data !== "object") return;
            if (data.type === "DAS_SAVE_DRAFT" && data.id) {
              const id = String(data.id);
              const newId = typeof data.newId === "string" ? data.newId.trim() : "";
              const payload = data.payload || null;
              if (payload?.rawLines?.length) {
                commitPartialSettlementLines(payload.rawLines);
              }
              const amount = safeNumber(data.amount);
              let effectiveId = id;
              setSettledList((prev) => {
                const exists = newId && prev.some((r) => r.id === newId);
                const canRename = newId && newId !== id && !exists;
                effectiveId = canRename ? newId : id;
                return prev.map((r) =>
                  r.id === id
                    ? {
                        ...r,
                        id: effectiveId,
                        payload: payload || r.payload,
                        amount: Number.isFinite(amount) ? amount : r.amount,
                        note: typeof data.note === "string" ? data.note : r.note,
                        notifyEmail: typeof data.notifyEmail === "string" ? data.notifyEmail : r.notifyEmail,
                        deductions: safeNumber(data.deductions ?? r.deductions),
                        adjustments: Array.isArray(data.adjustments) ? data.adjustments : r.adjustments,
                      }
                    : r
                );
              });
              try {
                evt.source?.postMessage({ type: "DAS_SAVE_DRAFT_DONE", id, newId: effectiveId }, "*");
              } catch {
                // ignore
              }
              return;
            }
            if (data.type === "DAS_ISSUE_INVOICE_WITH_DATA" && data.id) {
              const id = String(data.id);
              const newId = typeof data.newId === "string" ? data.newId.trim() : "";
              // 先儲存再開立
              const payload = data.payload || null;
              if (payload?.rawLines?.length) {
                commitPartialSettlementLines(payload.rawLines);
              }
              const amount = safeNumber(data.amount);
              let effectiveId = id;
              setSettledList((prev) => {
                const exists = newId && prev.some((r) => r.id === newId);
                const canRename = newId && newId !== id && !exists;
                effectiveId = canRename ? newId : id;
                return prev.map((r) =>
                  r.id === id
                    ? {
                        ...r,
                        id: effectiveId,
                        payload: payload || r.payload,
                        amount: Number.isFinite(amount) ? amount : r.amount,
                        note: typeof data.note === "string" ? data.note : r.note,
                        notifyEmail: typeof data.notifyEmail === "string" ? data.notifyEmail : r.notifyEmail,
                        deductions: safeNumber(data.deductions ?? r.deductions),
                        adjustments: Array.isArray(data.adjustments) ? data.adjustments : r.adjustments,
                      }
                    : r
                );
              });
              issueInvoiceForId(effectiveId);
              try {
                evt.source?.postMessage({ type: "DAS_ISSUE_INVOICE_DONE", id, newId: effectiveId }, "*");
              } catch {
                // ignore
              }
              return;
            }
            if (data.type === "DAS_ISSUE_INVOICE" && data.id) {
              issueInvoiceForId(String(data.id));
              try {
                evt.source?.postMessage({ type: "DAS_ISSUE_INVOICE_DONE", id: String(data.id) }, "*");
              } catch {
                // ignore
              }
            }
          };
          window.addEventListener("message", onMsg);
          return () => window.removeEventListener("message", onMsg);
        }, [settledList]);

        return (
          <div className="min-h-screen bg-gray-50 text-gray-800 font-sans">
            <nav className="bg-white border-b px-6 py-4 flex justify-between items-center sticky top-0 z-10">
              <div className="flex items-center gap-6">
                <h1 className="text-xl font-bold text-gray-900 flex items-center gap-2">
                  出退貨請款與發票系統 Prototype
                  <span className="text-xs font-semibold px-2 py-1 rounded bg-gray-100 text-gray-600 border border-gray-200">
                    v{APP_VERSION}
                  </span>
                </h1>
                <div className="flex bg-gray-100 p-1 rounded-lg">
                  <button
                    onClick={() => {
                      setImportState((prev) => ({
                        ...prev,
                        rawLines: (prev.rawLines || []).map((r) => applyPartialFieldsToRow(r)),
                      }));
                      setCurrentView("settling");
                    }}
                    className={`px-4 py-1.5 rounded-md text-sm font-medium transition-colors ${
                      currentView === "settling"
                        ? "bg-white text-blue-600 shadow-sm"
                        : "text-gray-500 hover:text-gray-700"
                    }`}
                  >
                    正在結算 (Step 3)
                  </button>
                  <button
                    onClick={() => setCurrentView("settled")}
                    className={`px-4 py-1.5 rounded-md text-sm font-medium transition-colors ${
                      currentView === "settled"
                        ? "bg-white text-blue-600 shadow-sm"
                        : "text-gray-500 hover:text-gray-700"
                    }`}
                  >
                    結算完畢列表
                  </button>
                  <button
                    onClick={() => setCurrentView("closed")}
                    className={`px-4 py-1.5 rounded-md text-sm font-medium transition-colors ${
                      currentView === "closed"
                        ? "bg-white text-blue-600 shadow-sm"
                        : "text-gray-500 hover:text-gray-700"
                    }`}
                  >
                    結案視角 (完成樣貌)
                  </button>
                </div>
              </div>
              <div className="flex items-center gap-3 text-sm">
                <span className="text-gray-500">當前狀態：</span>
                <span className="bg-blue-100 text-blue-700 px-3 py-1 rounded-md font-medium">
                  {currentView === "settling"
                    ? "已彙總待開立"
                    : currentView === "settled"
                    ? "結算已完成"
                    : "結案（鎖定）"}
                </span>
              </div>
            </nav>

            <main className="max-w-6xl mx-auto py-8 px-6">
              {showSuccessToast && (
                <div className="fixed top-20 right-6 bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-lg shadow-lg flex items-center gap-2 z-50 animate-in fade-in slide-in-from-top-4">
                  <Icon name="check-circle" className="w-5 h-5" />
                  <span>已儲存為草稿，請至結算列表檢視/開立！</span>
                </div>
              )}

              {currentView === "settling" ? (
                <SettlingView
                  onUploadPending={handleSaveDraft}
                  isProcessing={isProcessing}
                  settlingDoc={settlingDoc}
                  setSettlingDoc={setSettlingDoc}
                  netAmount={netAmount}
                  importState={importState}
                  setImportState={setImportState}
                  onPromoteToClosed={(payload) => {
                    // payload: { rawLines, subtotals, periodStart, periodEnd, channel }
                    setClosedDoc((prev) => ({
                      ...prev,
                      id: settlingDoc.id,
                      channel: payload.channel || settlingDoc.channel,
                      periodStart: payload.periodStart || prev.periodStart,
                      periodEnd: payload.periodEnd || prev.periodEnd,
                      shipDateRange:
                        payload.periodStart && payload.periodEnd
                          ? `${payload.periodStart.replaceAll("-", "/")} - ${payload.periodEnd.replaceAll("-", "/")}`
                          : prev.shipDateRange,
                      purchaseTotal: settlingDoc.purchaseTotal || 0,
                      returnTotal: settlingDoc.returnTotal || 0,
                      deductions: settlingDoc.deductions || 0,
                      netAmount,
                      subtotals: payload.subtotals || prev.subtotals,
                      rawLines: payload.rawLines || prev.rawLines,
                    }));
                  }}
                />
              ) : currentView === "settled" ? (
                <SettledListView
                  rows={settledList}
                  onIssuePending={(row) => issueInvoiceForId(row?.id)}
                  onOpenClosed={(row) => {
                    setClosedDoc((prev) => ({
                      ...prev,
                      id: row.id,
                      channel: row.channel,
                      invoiceNo: row.invoiceNo,
                      invoiceDate: row.date.replaceAll("/", "-"),
                      issuer: row.issuer,
                      netAmount: row.amount,
                      status: "結案 (鎖定)",
                    }));
                    setCurrentView("closed");
                  }}
                />
              ) : (
                <ClosedView
                  doc={closedDoc}
                  onBackToList={() => setCurrentView("settled")}
                  onBackToSettling={() => setCurrentView("settling")}
                />
              )}
            </main>
          </div>
        );
      }

      function SettlingView({
        onUploadPending,
        isProcessing,
        settlingDoc,
        setSettlingDoc,
        netAmount,
        importState,
        setImportState,
        onPromoteToClosed,
      }) {
        const [currentStep, setCurrentStep] = useState(1);

        return (
          <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <div className="px-10 py-10 border-b border-gray-100">
              <div className="flex items-center justify-between max-w-4xl mx-auto">
                <div
                  className="flex flex-col items-center gap-2 w-32 relative cursor-pointer hover:opacity-80 transition-opacity"
                  onClick={() => setCurrentStep(1)}
                >
                  <div
                    className={`w-12 h-12 rounded-full border-2 flex items-center justify-center bg-white z-10 transition-all duration-300 ${
                      currentStep > 1
                        ? "border-blue-500 text-blue-500"
                        : currentStep === 1
                        ? "border-blue-500 bg-blue-500 text-white shadow-md"
                        : "border-gray-200 text-gray-400"
                    }`}
                  >
                    {currentStep > 1 ? (
                      <Icon name="check-circle-2" className="w-6 h-6" />
                    ) : (
                      <Icon name="upload-cloud" className="w-6 h-6" />
                    )}
                  </div>
                  <div className="text-center">
                    <div
                      className={`text-sm font-medium transition-colors ${
                        currentStep >= 1 ? "text-blue-500" : "text-gray-400"
                      }`}
                    >
                      Step 1
                    </div>
                    <div
                      className={`text-xs transition-colors ${
                        currentStep >= 1 ? "text-blue-500" : "text-gray-400"
                      }`}
                    >
                      上傳與明細
                    </div>
                  </div>
                </div>

                <div
                  className={`flex-1 h-0.5 -mt-8 transition-colors duration-500 ${
                    currentStep >= 2 ? "bg-blue-500" : "bg-gray-200"
                  }`}
                ></div>

                <div
                  className="flex flex-col items-center gap-2 w-32 relative cursor-pointer hover:opacity-80 transition-opacity"
                  onClick={() => setCurrentStep(2)}
                >
                  <div
                    className={`w-12 h-12 rounded-full border-2 flex items-center justify-center bg-white z-10 transition-all duration-300 ${
                      currentStep > 2
                        ? "border-blue-500 text-blue-500"
                        : currentStep === 2
                        ? "border-blue-500 bg-blue-500 text-white shadow-md"
                        : "border-gray-200 text-gray-400"
                    }`}
                  >
                    {currentStep > 2 ? (
                      <Icon name="check-circle-2" className="w-6 h-6" />
                    ) : (
                      <Icon name="calculator" className="w-6 h-6" />
                    )}
                  </div>
                  <div className="text-center">
                    <div
                      className={`text-sm font-medium transition-colors ${
                        currentStep >= 2 ? "text-blue-500" : "text-gray-400"
                      }`}
                    >
                      Step 2
                    </div>
                    <div
                      className={`text-xs transition-colors ${
                        currentStep >= 2 ? "text-blue-500" : "text-gray-400"
                      }`}
                    >
                      Net 計算 / 小計
                    </div>
                  </div>
                </div>

                <div
                  className={`flex-1 h-0.5 -mt-8 transition-colors duration-500 ${
                    currentStep >= 3 ? "bg-blue-500" : "bg-gray-200"
                  }`}
                ></div>

                <div
                  className="flex flex-col items-center gap-2 w-32 relative cursor-pointer hover:opacity-80 transition-opacity"
                  onClick={() => setCurrentStep(3)}
                >
                  <div
                    className={`w-12 h-12 rounded-full border-2 flex items-center justify-center bg-white z-10 transition-all duration-300 ${
                      currentStep === 3
                        ? "border-blue-500 bg-blue-500 text-white shadow-md"
                        : "border-gray-200 text-gray-400"
                    }`}
                  >
                    <Icon name="file-text" className="w-6 h-6" />
                  </div>
                  <div className="text-center">
                    <div
                      className={`text-sm font-medium transition-colors ${
                        currentStep >= 3 ? "text-blue-500" : "text-gray-400"
                      }`}
                    >
                      Step 3
                    </div>
                    <div
                      className={`text-xs transition-colors ${
                        currentStep >= 3 ? "text-blue-500" : "text-gray-400"
                      }`}
                    >
                      開立發票
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div className="p-8">
              {currentStep === 1 && (
                <Step1Content
                  importState={importState}
                  setImportState={setImportState}
                  onNext={() => setCurrentStep(2)}
                />
              )}
              {currentStep === 2 && (
                <Step2Content
                  settlingDoc={settlingDoc}
                  setSettlingDoc={setSettlingDoc}
                  netAmount={netAmount}
                  importState={importState}
                  setImportState={setImportState}
                  onPrev={() => setCurrentStep(1)}
                  onNext={() => setCurrentStep(3)}
                />
              )}
              {currentStep === 3 && (
                <Step3Content
                  settlingDoc={settlingDoc}
                  setSettlingDoc={setSettlingDoc}
                  netAmount={netAmount}
                  importState={importState}
                  setImportState={setImportState}
                  onPromoteToClosed={onPromoteToClosed}
                  onPrev={() => setCurrentStep(2)}
                  onUploadPending={onUploadPending}
                  isProcessing={isProcessing}
                />
              )}
            </div>
          </div>
        );
      }

      function Step1Content({ onNext, importState, setImportState }) {
        const [error, setError] = useState("");
        const [isParsing, setIsParsing] = useState(false);

        const uniqueChannelShorts = useMemo(() => {
          const s = new Set();
          for (const r of importState.rawLines || []) {
            if (r.channelShort) s.add(r.channelShort);
          }
          return Array.from(s).sort((a, b) => a.localeCompare(b, "zh-Hant"));
        }, [importState.rawLines]);

        const filteredRaw = useMemo(() => {
          const q = (importState.filter?.q || "").trim();
          const qLower = q.toLowerCase();
          const shipStart = importState.filter?.shipStart || "";
          const shipEnd = importState.filter?.shipEnd || "";

          return (importState.rawLines || []).filter((r) => {
            if (shipStart && r.shipDateISO && r.shipDateISO < shipStart) return false;
            if (shipEnd && r.shipDateISO && r.shipDateISO > shipEnd) return false;
            if (qLower) {
              const hay = `${r.docType} ${r.docNo} ${r.channelShort} ${r.channelFull} ${r.sku} ${r.skuName}`.toLowerCase();
              if (!hay.includes(qLower)) return false;
            }
            if (importState.filter?.hideFullySettled !== false) {
              const t = normalizeDocType(r.docType);
              if ((t === "出貨" || t === "退貨") && safeNumber(r.availableQty) <= 0) return false;
            }
            return true;
          });
        }, [importState.rawLines, importState.filter]);

        const handleFiles = async (files) => {
          const file = files?.[0];
          if (!file) return;
          setError("");
          setIsParsing(true);
          try {
            const name = file.name || "";
            const lower = name.toLowerCase();
            let rows = [];

            const mapRow = (row) => {
              // 支援中英文/可能的欄位別名
              const get = (...keys) => {
                for (const k of keys) {
                  if (row && Object.prototype.hasOwnProperty.call(row, k)) return row[k];
                }
                return undefined;
              };

              const docType = normalizeDocType(get("單據類型", "docType", "DocType", "類型", "單據"));
              const docNo = String(get("單號", "docNo", "DocNo", "單據編號", "單據號") || "").trim();
              const channelShort = String(get("通路商簡稱", "channelShort", "通路簡稱", "客戶簡稱") || "").trim();
              const channelFull = String(get("通路商", "channel", "通路商全名", "客戶", "客戶名稱") || "").trim();
              const shipDate = get("實際出貨日期", "shipDate", "出貨日期", "實際出貨日");
              const inDate = get("實際入庫日期", "inDate", "入庫日期", "實際入庫日");
              const sku = String(get("sku(品號)", "SKU", "sku", "品號", "料號") || "").trim();
              const skuName = String(get("商品名稱", "skuName", "品名", "商品") || "").trim();
              const unitPrice = safeNumber(get("單價", "unitPrice", "單價(未稅)", "price"));
              const qty = safeNumber(get("數量", "qty", "數量(出退貨)", "數量_出退"));
              // 規則：若有「單價」，金額一律用 單價 * 數量（出/退都取絕對值，由後續 isReturn 判斷方向）
              let lineAmount = 0;
              if (unitPrice) {
                lineAmount = Math.abs(unitPrice) * Math.abs(qty);
              } else {
                lineAmount = Math.abs(safeNumber(get("小計金額", "lineAmount", "金額", "小計", "小計(未稅)")));
              }

              const shipDateISO = toISODateMaybe(shipDate);
              const inDateISO = toISODateMaybe(inDate);

              return {
                docType: docType || "",
                docNo,
                channelShort,
                channelFull,
                shipDate: shipDateISO ? shipDateISO.replaceAll("-", "/") : String(shipDate || "").trim(),
                inDate: inDateISO ? inDateISO.replaceAll("-", "/") : String(inDate || "").trim(),
                shipDateISO,
                inDateISO,
                sku,
                skuName,
                unitPrice,
                qty,
                lineAmount,
              };
            };

            if (lower.endsWith(".csv")) {
              if (!window.Papa) throw new Error("CSV 解析器載入失敗（PapaParse）");
              const text = await file.text();
              const parsed = window.Papa.parse(text, { header: true, skipEmptyLines: true });
              if (parsed.errors?.length) {
                const msg = parsed.errors[0]?.message || "CSV 解析失敗";
                throw new Error(msg);
              }
              rows = (parsed.data || []).map(mapRow);
            } else if (lower.endsWith(".xlsx") || lower.endsWith(".xls")) {
              if (!window.XLSX) throw new Error("Excel 解析器載入失敗（SheetJS）");
              const buf = await file.arrayBuffer();
              const wb = window.XLSX.read(buf, { type: "array" });
              const sheetName = wb.SheetNames?.[0];
              if (!sheetName) throw new Error("Excel 找不到工作表");
              const ws = wb.Sheets[sheetName];
              const json = window.XLSX.utils.sheet_to_json(ws, { defval: "" });
              rows = (json || []).map(mapRow);
            } else {
              throw new Error("不支援的檔案格式，請上傳 CSV / XLSX / XLS");
            }

            const normalized = rows
              .map((r) => ({
                ...r,
                docType: normalizeDocType(r.docType),
              }))
              .filter((r) => r.channelShort || r.channelFull || r.sku || r.docNo);

            // 兼容舊資料：把 channel 欄位清掉（改用 channelShort / channelFull）
            const normalized2 = normalized.map((r) => ({
              ...r,
              channelShort: r.channelShort || "",
              channelFull: r.channelFull || "",
            }));

            const nextFilter = {
              channelShort: importState.filter?.channelShort || "",
              shipStart: importState.filter?.shipStart || "",
              shipEnd: importState.filter?.shipEnd || "",
              q: importState.filter?.q || "",
              docTypes: [],
              docNos: [],
              hideFullySettled: importState.filter?.hideFullySettled !== false,
            };

            // 預設期間：用出貨日最小/最大
            const dates = normalized2.map((r) => r.shipDateISO).filter(Boolean).sort();
            if (!nextFilter.shipStart && dates.length) nextFilter.shipStart = dates[0];
            if (!nextFilter.shipEnd && dates.length) nextFilter.shipEnd = dates[dates.length - 1];

            const mergedRows = mergeShipmentRowsByKey(normalized2);
            const enrichedRows = mergedRows.map((r) => applyPartialFieldsToRow(r));
            const withIds = enrichedRows.map((r, idx) => ({
              ...r,
              _id: `${r.docNo || "row"}__${r.sku || ""}__${r.shipDateISO || ""}__${idx}`,
            }));

            setImportState({
              fileName: name,
              importedAt: new Date().toISOString(),
              rawLines: withIds,
              filter: nextFilter,
              selectedIds: [],
              subtotals: [],
              confirmed: false,
            });
          } catch (e) {
            setError(e?.message || "解析失敗");
          } finally {
            setIsParsing(false);
          }
        };

        const clearAll = () => {
          setImportState({
            fileName: "",
            importedAt: "",
            rawLines: [],
            filter: { channelShort: "", shipStart: "", shipEnd: "", q: "", docTypes: [], docNos: [], hideFullySettled: true },
            selectedIds: [],
            subtotals: [],
            confirmed: false,
          });
          setError("");
        };

        return (
          <div className="animate-in fade-in slide-in-from-right-4 duration-300">
            <h2 className="text-lg font-bold mb-6 flex items-center gap-2">1. 上傳進銷存明細</h2>

            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
              <div className="lg:col-span-1">
                <label className="block border-2 border-dashed border-gray-300 rounded-xl p-8 text-center bg-gray-50 hover:bg-gray-100 transition-colors cursor-pointer">
                  <input
                    type="file"
                    accept=".csv,.xlsx,.xls"
                    className="hidden"
                    onChange={(e) => handleFiles(e.target.files)}
                    disabled={isParsing}
                  />
                  <Icon name={isParsing ? "loader-2" : "upload-cloud"} className={`w-10 h-10 mx-auto mb-3 ${isParsing ? "animate-spin text-blue-500" : "text-gray-400"}`} />
                  <p className="text-gray-800 font-semibold">點擊選擇檔案</p>
                  <p className="text-sm text-gray-500 mt-2">支援 CSV / Excel（純前端解析）</p>
                  {importState.fileName && (
                    <div className="mt-4 text-left text-xs text-gray-600 bg-white border border-gray-200 rounded-lg p-3">
                      <div className="font-medium text-gray-800 truncate">{importState.fileName}</div>
                      <div className="mt-1">筆數：{importState.rawLines?.length || 0}</div>
                      <div className="mt-1">匯入時間：{importState.importedAt ? new Date(importState.importedAt).toLocaleString() : "-"}</div>
                    </div>
                  )}
                </label>

                {error && (
                  <div className="mt-3 border border-red-200 bg-red-50 text-red-700 rounded-lg px-4 py-3 text-sm">
                    {error}
                  </div>
                )}

                <div className="mt-4 border border-gray-200 rounded-xl p-4 bg-white">
                  <div className="text-sm font-semibold text-gray-800 flex items-center gap-2">
                    <Icon name="filter" className="w-4 h-4 text-gray-500" />
                    篩選條件
                  </div>
                  <div className="mt-3 space-y-3">
                    <div className="border border-gray-200 rounded-lg px-3 py-2 bg-gray-50 text-sm">
                      <div className="text-xs text-gray-500">通路識別（自動）</div>
                      <div className="mt-1 text-gray-800 font-medium">
                        {uniqueChannelShorts.length === 0
                          ? "—"
                          : uniqueChannelShorts.length === 1
                          ? uniqueChannelShorts[0]
                          : `${uniqueChannelShorts[0]}…（共 ${uniqueChannelShorts.length} 個）`}
                      </div>
                      <div className="mt-1 text-xs text-gray-500">下一步可用「通路商下拉」與日期範圍篩選，並勾選要結算的單據</div>
                    </div>

                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <div className="text-xs text-gray-500 mb-1">日期（起）</div>
                        <input
                          type="date"
                          value={importState.filter?.shipStart || ""}
                          onChange={(e) =>
                            setImportState((prev) => ({
                              ...prev,
                              filter: { ...(prev.filter || {}), shipStart: e.target.value },
                              confirmed: false,
                            }))
                          }
                          className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500"
                          disabled={(importState.rawLines?.length || 0) === 0}
                        />
                      </div>
                      <div>
                        <div className="text-xs text-gray-500 mb-1">日期（迄）</div>
                        <input
                          type="date"
                          value={importState.filter?.shipEnd || ""}
                          onChange={(e) =>
                            setImportState((prev) => ({
                              ...prev,
                              filter: { ...(prev.filter || {}), shipEnd: e.target.value },
                              confirmed: false,
                            }))
                          }
                          className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500"
                          disabled={(importState.rawLines?.length || 0) === 0}
                        />
                      </div>
                    </div>

                    <div>
                      <div className="text-xs text-gray-500 mb-1">關鍵字</div>
                      <input
                        type="text"
                        placeholder="單號 / SKU / 商品 / 通路商..."
                        value={importState.filter?.q || ""}
                        onChange={(e) =>
                          setImportState((prev) => ({
                            ...prev,
                            filter: { ...(prev.filter || {}), q: e.target.value },
                          }))
                        }
                        className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500"
                        disabled={(importState.rawLines?.length || 0) === 0}
                      />
                    </div>

                    <label className="flex items-center gap-2 text-sm text-gray-700 cursor-pointer">
                      <input
                        type="checkbox"
                        checked={importState.filter?.hideFullySettled !== false}
                        onChange={(e) =>
                          setImportState((prev) => ({
                            ...prev,
                            filter: { ...(prev.filter || {}), hideFullySettled: e.target.checked },
                          }))
                        }
                        className="w-4 h-4 accent-blue-600"
                        disabled={(importState.rawLines?.length || 0) === 0}
                      />
                      僅顯示可結算之出貨/退貨（剩餘數量 &gt; 0）
                    </label>

                    <div className="flex items-center justify-between pt-2">
                      <button
                        onClick={clearAll}
                        className="text-sm text-gray-600 hover:text-gray-800"
                        disabled={(importState.rawLines?.length || 0) === 0}
                      >
                        清除資料
                      </button>
            </div>
                  </div>
                </div>
              </div>

              <div className="lg:col-span-2">
                <div className="border border-gray-200 rounded-xl overflow-hidden bg-white">
                  <div className="bg-gray-50 px-5 py-3 text-sm text-gray-600 font-medium flex items-center justify-between gap-4">
                    <div className="flex items-center gap-2">
                      <Icon name="table" className="w-4 h-4" />
                      明細預覽（依篩選顯示）
                    </div>
                    <div className="text-xs text-gray-500">
                      顯示 {filteredRaw.length} 筆（原始共 {importState.rawLines?.length || 0} 筆）
                    </div>
                  </div>
                  <div className="overflow-auto max-h-[520px]">
                    <table className="w-full text-left text-sm">
                      <thead className="bg-white text-gray-500 sticky top-0 z-10 border-b border-gray-100">
                        <tr>
                          <th className="px-4 py-3 font-medium">單據類型</th>
                          <th className="px-4 py-3 font-medium">狀態</th>
                          <th className="px-4 py-3 font-medium">單號</th>
                          <th className="px-4 py-3 font-medium">通路商簡稱</th>
                          <th className="px-4 py-3 font-medium">出貨日</th>
                          <th className="px-4 py-3 font-medium">SKU</th>
                          <th className="px-4 py-3 font-medium">商品名稱</th>
                          <th className="px-4 py-3 font-medium">單價</th>
                          <th className="px-4 py-3 font-medium">原始數量</th>
                          <th className="px-4 py-3 font-medium">剩餘可結</th>
                          <th className="px-4 py-3 font-medium">小計金額</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-gray-100">
                        {filteredRaw.slice(0, 200).map((r, idx) => (
                          <tr key={(r.docNo || "row") + "_" + idx} className="hover:bg-blue-50/30 transition-colors">
                            <td className="px-4 py-3">
                              <span
                                className={`inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium border ${
                                  normalizeDocType(r.docType) === "退貨"
                                    ? "bg-red-50 text-red-700 border-red-200"
                                    : "bg-blue-50 text-blue-700 border-blue-200"
                                }`}
                              >
                                {normalizeDocType(r.docType) || "-"}
                              </span>
                            </td>
                            <td className="px-4 py-3">
                              <span
                                className={`inline-flex items-center px-2 py-1 rounded-md text-xs font-medium border ${
                                  partialSettlementStatusLabel(r) === "部分結算"
                                    ? "bg-amber-50 text-amber-900 border-amber-200"
                                    : partialSettlementStatusLabel(r) === "未結算"
                                    ? "bg-slate-50 text-slate-700 border-slate-200"
                                    : partialSettlementStatusLabel(r) === "已全部結算"
                                    ? "bg-gray-100 text-gray-500 border-gray-200"
                                    : "bg-white text-gray-400 border-gray-100"
                                }`}
                              >
                                {partialSettlementStatusLabel(r)}
                              </span>
                            </td>
                            <td className="px-4 py-3 font-mono text-gray-900">{r.docNo || "-"}</td>
                            <td className="px-4 py-3 text-gray-700">{r.channelShort || "-"}</td>
                            <td className="px-4 py-3 text-gray-700">{r.shipDate || "-"}</td>
                            <td className="px-4 py-3 font-mono text-gray-800">{r.sku || "-"}</td>
                            <td className="px-4 py-3 text-gray-700">{r.skuName || "-"}</td>
                            <td className="px-4 py-3 text-gray-700">{formatMoney(r.unitPrice)}</td>
                            <td className="px-4 py-3 text-gray-700">
                              {safeNumber(r.originalQty)}
                            </td>
                            <td className="px-4 py-3 text-gray-700 font-medium text-blue-700">
                              {(normalizeDocType(r.docType) === "出貨" || normalizeDocType(r.docType) === "退貨") ? safeNumber(r.availableQty) : "—"}
                            </td>
                            <td className="px-4 py-3 text-gray-900 font-medium">{formatMoney(r.lineAmount)}</td>
                          </tr>
                        ))}
                        {filteredRaw.length === 0 && (
                          <tr>
                            <td colSpan="11" className="px-6 py-10 text-center text-gray-500">
                              尚未匯入資料，或篩選條件下沒有資料
                            </td>
                          </tr>
                        )}
                      </tbody>
                    </table>
                  </div>
                  {filteredRaw.length > 200 && (
                    <div className="px-5 py-3 text-xs text-gray-500 border-t border-gray-100 bg-white">
                      為了效能，這裡最多預覽前 200 筆（但小計計算會使用完整篩選結果）
                    </div>
                  )}
                </div>
              </div>
            </div>

            <div className="flex justify-end pt-4 border-t border-gray-100">
              <button
                onClick={onNext}
                disabled={(importState.rawLines?.length || 0) === 0}
                className="flex items-center gap-2 px-6 py-2.5 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors shadow-sm font-medium"
              >
                下一步：確認 Net 計算
                <Icon name="chevron-right" className="w-4 h-4" />
              </button>
            </div>
          </div>
        );
      }

      function Step2Content({ onPrev, onNext, settlingDoc, setSettlingDoc, netAmount, importState, setImportState }) {
        const [warn, setWarn] = useState("");
        const [draft, setDraft] = useState(() => ({
          channelShort: importState.filter?.channelShort || "",
          shipStart: importState.filter?.shipStart || "",
          shipEnd: importState.filter?.shipEnd || "",
          q: importState.filter?.q || "",
          docTypes: importState.filter?.docTypes || [],
          docNos: importState.filter?.docNos || [],
          hideFullySettled: importState.filter?.hideFullySettled !== false,
        }));

        useEffect(() => {
          setDraft({
            channelShort: importState.filter?.channelShort || "",
            shipStart: importState.filter?.shipStart || "",
            shipEnd: importState.filter?.shipEnd || "",
            q: importState.filter?.q || "",
            docTypes: importState.filter?.docTypes || [],
            docNos: importState.filter?.docNos || [],
            hideFullySettled: importState.filter?.hideFullySettled !== false,
          });
        }, [
          importState.filter?.channelShort,
          importState.filter?.shipStart,
          importState.filter?.shipEnd,
          importState.filter?.q,
          importState.filter?.hideFullySettled,
        ]);

        const channelOptions = useMemo(() => {
          const s = new Set();
          for (const r of importState.rawLines || []) {
            if (r.channelShort) s.add(r.channelShort);
          }
          return Array.from(s).sort((a, b) => a.localeCompare(b, "zh-Hant"));
        }, [importState.rawLines]);

        const filteredRows = useMemo(() => {
          // Step2 篩選以「已套用」的條件為準
          const q = (importState.filter?.q || "").trim().toLowerCase();
          const shipStart = importState.filter?.shipStart || "";
          const shipEnd = importState.filter?.shipEnd || "";
          const channelShort = importState.filter?.channelShort || "";
          const docTypes = importState.filter?.docTypes || [];
          const docNos = importState.filter?.docNos || [];

          return (importState.rawLines || []).filter((r) => {
            if (channelShort && r.channelShort !== channelShort) return false;
            if (docTypes.length) {
              const t = normalizeDocType(r.docType);
              if (!docTypes.includes(t)) return false;
            }
            if (docNos.length) {
              if (!docNos.includes(String(r.docNo || ""))) return false;
            }
            // 日期篩選：不只看出貨日，只要「出貨日或入庫日」任一在區間內就納入
            if (shipStart || shipEnd) {
              const ship = r.shipDateISO || "";
              const inbound = r.inDateISO || "";
              const inRange = (d) => {
                if (!d) return false;
                if (shipStart && d < shipStart) return false;
                if (shipEnd && d > shipEnd) return false;
                return true;
              };
              if (!inRange(ship) && !inRange(inbound)) return false;
            }
            if (q) {
              const hay = `${r.docType} ${r.docNo} ${r.channelShort} ${r.channelFull} ${r.sku} ${r.skuName}`.toLowerCase();
              if (!hay.includes(q)) return false;
            }
            if (importState.filter?.hideFullySettled !== false) {
              const t = normalizeDocType(r.docType);
              if ((t === "出貨" || t === "退貨") && safeNumber(r.availableQty) <= 0) return false;
            }
            return true;
          });
        }, [importState.rawLines, importState.filter]);

        const docNoOptions = useMemo(() => {
          // 依「草稿條件」產生單號選項，並且要求先選通路+單據類型才出選項
          const q = (draft.q || "").trim().toLowerCase();
          const shipStart = draft.shipStart || "";
          const shipEnd = draft.shipEnd || "";
          const channelShort = draft.channelShort || "";
          const docTypes = draft.docTypes || [];

          if (!channelShort || docTypes.length === 0) return [];

          const set = new Set();
          for (const r of importState.rawLines || []) {
            if (channelShort && r.channelShort !== channelShort) continue;
            if (docTypes.length) {
              const t = normalizeDocType(r.docType);
              if (!docTypes.includes(t)) continue;
            }
            if (shipStart || shipEnd) {
              const ship = r.shipDateISO || "";
              const inbound = r.inDateISO || "";
              const inRange = (d) => {
                if (!d) return false;
                if (shipStart && d < shipStart) return false;
                if (shipEnd && d > shipEnd) return false;
                return true;
              };
              if (!inRange(ship) && !inRange(inbound)) continue;
            }
            if (q) {
              const hay = `${r.docType} ${r.docNo} ${r.channelShort} ${r.channelFull} ${r.sku} ${r.skuName}`.toLowerCase();
              if (!hay.includes(q)) continue;
            }
            if (r.docNo) set.add(String(r.docNo));
          }
          return Array.from(set).sort((a, b) => a.localeCompare(b, "zh-Hant"));
        }, [
          importState.rawLines,
          draft.channelShort,
          draft.shipStart,
          draft.shipEnd,
          draft.q,
          draft.docTypes,
        ]);

        const canPickDocNos = !!draft.channelShort && (draft.docTypes || []).length > 0;

        const selectedSet = useMemo(() => new Set(importState.selectedIds || []), [importState.selectedIds]);

        const selectedRows = useMemo(() => {
          const ids = selectedSet;
          return (importState.rawLines || []).filter((r) => ids.has(r._id));
        }, [importState.rawLines, selectedSet]);

        const typeCounts = useMemo(() => {
          const countTypes = (rows) => {
            let ship = 0;
            let ret = 0;
            for (const r of rows || []) {
              const t = normalizeDocType(r.docType);
              if (t === "退貨") ret += 1;
              else ship += 1;
            }
            return { ship, ret };
          };
          return {
            filtered: countTypes(filteredRows),
            selected: countTypes(selectedRows),
          };
        }, [filteredRows, selectedRows]);

        const canProceed = (importState.selectedIds || []).length > 0;

        return (
          <div className="animate-in fade-in slide-in-from-right-4 duration-300">
            <h2 className="text-lg font-bold mb-6 flex items-center gap-2">2. 篩選與選擇單據</h2>

            <div className="space-y-4 mb-6">
              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div className="border border-gray-200 rounded-xl p-4 bg-white">
                <div className="text-xs text-gray-500">通路商（下拉）</div>
                <select
                  value={draft.channelShort}
                  onChange={(e) =>
                    setDraft((prev) => ({
                      ...prev,
                      channelShort: e.target.value,
                      docNos: [],
                    }))
                  }
                  className="mt-2 w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500"
                  disabled={(importState.rawLines?.length || 0) === 0}
                >
                  <option value="">（全部通路）</option>
                  {channelOptions.map((c) => (
                    <option key={c} value={c}>
                      {c}
                    </option>
                  ))}
                </select>
              </div>

              <div className="border border-gray-200 rounded-xl p-4 bg-white">
                <div className="text-xs text-gray-500">單據類型（多選）</div>
                <div className="mt-2 flex items-center gap-3 text-sm">
                  {["出貨", "退貨"].map((t) => (
                    <label key={t} className="inline-flex items-center gap-2 text-gray-700">
                      <input
                        type="checkbox"
                        checked={(draft.docTypes || []).includes(t)}
                        onChange={(e) => {
                          const next = new Set(draft.docTypes || []);
                          if (e.target.checked) next.add(t);
                          else next.delete(t);
                          setDraft((prev) => ({ ...prev, docTypes: Array.from(next), docNos: [] }));
                        }}
                        className="w-4 h-4 accent-blue-600"
                      />
                      {t}
                    </label>
                  ))}
                </div>
                <div className="mt-1 text-xs text-gray-500">提示：先選通路＋單據類型後才會開啟單號選項</div>
              </div>
              <div className="border border-gray-200 rounded-xl p-4 bg-white">
                <div className="text-xs text-gray-500">關鍵字</div>
                <input
                  type="text"
                  placeholder="單號 / SKU / 商品 / 通路..."
                  value={draft.q}
                  onChange={(e) => setDraft((prev) => ({ ...prev, q: e.target.value }))}
                  className="mt-2 w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500"
                  disabled={(importState.rawLines?.length || 0) === 0}
                />
              </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div className="border border-gray-200 rounded-xl p-4 bg-white">
                  <div className="text-xs text-gray-500">日期（起）</div>
                  <input
                    type="date"
                    value={draft.shipStart}
                    onChange={(e) => setDraft((prev) => ({ ...prev, shipStart: e.target.value }))}
                    className="mt-2 w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500"
                    disabled={(importState.rawLines?.length || 0) === 0}
                  />
                </div>
                <div className="border border-gray-200 rounded-xl p-4 bg-white">
                  <div className="text-xs text-gray-500">日期（迄）</div>
                  <input
                    type="date"
                    value={draft.shipEnd}
                    onChange={(e) => setDraft((prev) => ({ ...prev, shipEnd: e.target.value }))}
                    className="mt-2 w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500"
                    disabled={(importState.rawLines?.length || 0) === 0}
                  />
                </div>
                <div className="border border-gray-200 rounded-xl p-4 bg-white">
                  <div className="text-xs text-gray-500">單號（多選）</div>
                  <select
                    multiple
                    value={draft.docNos || []}
                    onChange={(e) => {
                      const selected = Array.from(e.target.selectedOptions).map((o) => o.value);
                      setDraft((prev) => ({ ...prev, docNos: selected }));
                    }}
                    className="mt-2 w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500 h-[76px]"
                    disabled={(importState.rawLines?.length || 0) === 0 || !canPickDocNos}
                  >
                    {!canPickDocNos ? (
                      <option value="" disabled>
                        請先選擇通路商與單據類型
                      </option>
                    ) : (
                      docNoOptions.map((no) => (
                        <option key={no} value={no}>
                          {no}
                        </option>
                      ))
                    )}
                  </select>
                  <div className="mt-1 text-xs text-gray-500">提示：可按住 Ctrl/Shift 多選</div>
                </div>
              </div>

              <label className="flex items-center gap-2 text-sm text-gray-700 cursor-pointer">
                <input
                  type="checkbox"
                  checked={draft.hideFullySettled !== false}
                  onChange={(e) => setDraft((prev) => ({ ...prev, hideFullySettled: e.target.checked }))}
                  className="w-4 h-4 accent-blue-600"
                  disabled={(importState.rawLines?.length || 0) === 0}
                />
                僅顯示可結算之出貨/退貨（剩餘可結數量 &gt; 0；已全部結算者隱藏）
              </label>
            </div>

            <div className="flex items-center justify-end gap-2 mb-6">
              <button
                onClick={() => {
                  setDraft({
                    channelShort: "",
                    shipStart: "",
                    shipEnd: "",
                    q: "",
                    docTypes: [],
                    docNos: [],
                    hideFullySettled: true,
                  });
                }}
                className="px-4 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 text-sm font-medium"
                disabled={(importState.rawLines?.length || 0) === 0}
              >
                清空條件
              </button>
              <button
                onClick={() => {
                  setWarn("");
                  setImportState((prev) => ({
                    ...prev,
                    filter: { ...(prev.filter || {}), ...draft },
                    selectedIds: [],
                    settleLines: [],
                    confirmed: false,
                    subtotals: [],
                  }));
                }}
                className="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 text-sm font-medium shadow-sm disabled:opacity-60 disabled:cursor-not-allowed"
                disabled={(importState.rawLines?.length || 0) === 0}
              >
                套用篩選
              </button>
            </div>

            {warn && (
              <div className="mb-6 border border-amber-200 bg-amber-50 text-amber-800 rounded-lg px-4 py-3 text-sm">
                {warn}
              </div>
            )}

            <div className="border border-gray-200 rounded-xl overflow-hidden mb-8 bg-white">
              <div className="bg-gray-50 px-5 py-3 text-sm text-gray-600 font-medium flex items-center justify-between gap-4">
                <div className="flex items-center gap-2">
                  <Icon name="list-checks" className="w-4 h-4" />
                  <span>
                    勾選要結算的單據（{importState.selectedIds?.length || 0} / {filteredRows.length}）
                  </span>
                  <span className="text-xs text-gray-500">
                    已勾選：出貨 {typeCounts.selected.ship} / 退貨 {typeCounts.selected.ret}　
                    篩選後：出貨 {typeCounts.filtered.ship} / 退貨 {typeCounts.filtered.ret}
                  </span>
                </div>
                <div className="flex items-center gap-2 text-xs text-gray-500">
                  <button
                    onClick={() =>
                      setImportState((prev) => ({
                        ...prev,
                        selectedIds: filteredRows
                          .filter(
                            (r) =>
                              !(
                                (normalizeDocType(r.docType) === "出貨" || normalizeDocType(r.docType) === "退貨") &&
                                safeNumber(r.availableQty) <= 0
                              )
                          )
                          .map((r) => r._id),
                      }))
                    }
                    className="px-3 py-1 border border-gray-300 rounded hover:bg-gray-50"
                    disabled={filteredRows.length === 0}
                  >
                    全選
                  </button>
                  <button
                    onClick={() => setImportState((prev) => ({ ...prev, selectedIds: [] }))}
                    className="px-3 py-1 border border-gray-300 rounded hover:bg-gray-50"
                    disabled={(importState.selectedIds?.length || 0) === 0}
                  >
                    全不選
                  </button>
                </div>
              </div>
              <div className="overflow-auto max-h-[520px]">
              <table className="w-full text-left text-sm">
                  <thead className="bg-white text-gray-500 sticky top-0 z-10 border-b border-gray-100">
                    <tr>
                      <th className="px-4 py-3 font-medium">勾選</th>
                      <th className="px-4 py-3 font-medium">狀態</th>
                      <th className="px-4 py-3 font-medium">單據類型</th>
                      <th className="px-4 py-3 font-medium">單號</th>
                      <th className="px-4 py-3 font-medium">通路商簡稱</th>
                      <th className="px-4 py-3 font-medium">出貨日</th>
                      <th className="px-4 py-3 font-medium">入庫日</th>
                      <th className="px-4 py-3 font-medium">SKU</th>
                      <th className="px-4 py-3 font-medium">商品名稱</th>
                      <th className="px-4 py-3 font-medium">單價</th>
                      <th className="px-4 py-3 font-medium">原始數量</th>
                      <th className="px-4 py-3 font-medium">剩餘可結</th>
                      <th className="px-4 py-3 font-medium">小計金額</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-gray-100">
                    {filteredRows.map((r, idx) => {
                      const checked = selectedSet.has(r._id);
                      const shipNoAvail =
                        (normalizeDocType(r.docType) === "出貨" || normalizeDocType(r.docType) === "退貨") &&
                        safeNumber(r.availableQty) <= 0;
                      return (
                        <tr key={r._id || idx} className="hover:bg-blue-50/30 transition-colors">
                          <td className="px-4 py-3">
                            <input
                              type="checkbox"
                              checked={checked}
                              disabled={shipNoAvail}
                              title={shipNoAvail ? "此單據已無剩餘可結算數量" : ""}
                              onChange={(e) => {
                                const next = new Set(importState.selectedIds || []);
                                if (e.target.checked) next.add(r._id);
                                else next.delete(r._id);
                                setImportState((prev) => ({ ...prev, selectedIds: Array.from(next), confirmed: false, settleLines: [], subtotals: [] }));
                              }}
                              className="w-4 h-4 accent-blue-600 disabled:opacity-40"
                            />
                          </td>
                          <td className="px-4 py-3 whitespace-nowrap">
                            <span
                              className={`inline-flex items-center px-2 py-1 rounded-md text-xs font-medium border ${
                                partialSettlementStatusLabel(r) === "部分結算"
                                  ? "bg-amber-50 text-amber-900 border-amber-200"
                                  : partialSettlementStatusLabel(r) === "未結算"
                                  ? "bg-slate-50 text-slate-700 border-slate-200"
                                  : partialSettlementStatusLabel(r) === "已全部結算"
                                  ? "bg-gray-100 text-gray-500 border-gray-200"
                                  : "bg-white text-gray-400 border-gray-100"
                              }`}
                            >
                              {partialSettlementStatusLabel(r)}
                            </span>
                          </td>
                          <td className="px-4 py-3">
                            <span
                              className={`inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium border ${
                                normalizeDocType(r.docType) === "退貨"
                                  ? "bg-red-50 text-red-700 border-red-200"
                                  : "bg-blue-50 text-blue-700 border-blue-200"
                              }`}
                            >
                              {normalizeDocType(r.docType) || "-"}
                            </span>
                          </td>
                          <td className="px-4 py-3 font-mono text-gray-900">{r.docNo || "-"}</td>
                          <td className="px-4 py-3 text-gray-700">{r.channelShort || "-"}</td>
                          <td className="px-4 py-3 text-gray-700">{r.shipDate || "-"}</td>
                          <td className="px-4 py-3 text-gray-700">
                            {normalizeDocType(r.docType) === "退貨" ? (r.inDate || "-") : (r.inDate || "-")}
                          </td>
                          <td className="px-4 py-3 font-mono text-gray-800">{r.sku || "-"}</td>
                          <td className="px-4 py-3 text-gray-700">{r.skuName || "-"}</td>
                          <td className="px-4 py-3 text-gray-700">{formatMoney(r.unitPrice)}</td>
                          <td className="px-4 py-3 text-gray-700">
                            {safeNumber(r.originalQty)}
                          </td>
                          <td className="px-4 py-3 text-blue-700 font-medium">
                            {(normalizeDocType(r.docType) === "出貨" || normalizeDocType(r.docType) === "退貨") ? safeNumber(r.availableQty) : "—"}
                          </td>
                          <td className="px-4 py-3 text-gray-900 font-medium">{formatMoney(r.lineAmount)}</td>
                        </tr>
                      );
                    })}
                    {filteredRows.length === 0 && (
                      <tr>
                        <td colSpan="13" className="px-6 py-10 text-center text-gray-500">
                          沒有符合條件的資料
                        </td>
                  </tr>
                    )}
                </tbody>
              </table>
            </div>
            </div>

            <div className="flex justify-between items-center pt-4 border-t border-gray-100">
              <button
                onClick={onPrev}
                className="flex items-center gap-2 px-5 py-2.5 border border-gray-300 text-gray-600 rounded-lg hover:bg-gray-50 transition-colors"
              >
                <Icon name="arrow-left" className="w-4 h-4" />
                <span>上一步</span>
              </button>
              <button
                onClick={() => {
                  setWarn("");
                  if (!canProceed) {
                    setWarn("請先勾選要結算的單據");
                    return;
                  }
                  const settleLines = selectedRows.map((r) => {
                    const fresh = applyPartialFieldsToRow(r);
                    const q = Math.max(0, safeNumber(fresh.availableQty));
                    return {
                      ...fresh,
                      unitPrice: safeNumber(fresh.unitPrice),
                      qty: q,
                      lineAmount: Math.abs(safeNumber(fresh.unitPrice)) * Math.abs(q),
                    };
                  });
                  const st = computeSubtotalsFromLines(settleLines);
                  const shipStart = importState.filter?.shipStart || "";
                  const shipEnd = importState.filter?.shipEnd || "";
                  const channel = importState.filter?.channelShort || (selectedRows?.[0]?.channelShort || "");
                  const shipAmount = st.reduce((acc, r) => acc + safeNumber(r.shipAmount), 0);
                  const returnAmount = st.reduce((acc, r) => acc + safeNumber(r.returnAmount), 0);
                  setSettlingDoc((prev) => ({
                    ...prev,
                    channel,
                    purchaseTotal: shipAmount,
                    returnTotal: returnAmount,
                    periodStart: shipStart,
                    periodEnd: shipEnd,
                  }));
                  setImportState((prev) => ({ ...prev, settleLines, subtotals: st, confirmed: false }));
                  onNext();
                }}
                disabled={!canProceed}
                className="flex items-center gap-2 px-6 py-2.5 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors shadow-sm font-medium"
              >
                下一步：SKU 小計確認
                <Icon name="chevron-right" className="w-4 h-4" />
