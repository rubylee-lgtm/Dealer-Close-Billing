              </button>
            </div>
          </div>
        );
      }

      function Step3Content({
        onPrev,
        onUploadPending,
        isProcessing,
        settlingDoc,
        setSettlingDoc,
        netAmount,
        importState,
        setImportState,
        onPromoteToClosed,
      }) {
        const canUpload = useMemo(() => {
          if (!importState.confirmed) return false;
          return true;
        }, [importState.confirmed]);

        const totals = useMemo(() => {
          const st = importState.subtotals || [];
          const shipAmount = st.reduce((acc, r) => acc + safeNumber(r.shipAmount), 0);
          const returnAmount = st.reduce((acc, r) => acc + safeNumber(r.returnAmount), 0);
          return {
            shipAmount,
            returnAmount,
            netBeforeDeduction: shipAmount - returnAmount,
          };
        }, [importState.subtotals]);

        const adjValue = (a) => safeNumber(a?.amountText ?? a?.amount);

        const adjustmentsSum = useMemo(() => {
          return (settlingDoc.adjustments || []).reduce((acc, a) => acc + adjValue(a), 0);
        }, [settlingDoc.adjustments]);

        const netAfterDeduction = useMemo(() => {
          return totals.netBeforeDeduction - safeNumber(settlingDoc.deductions);
        }, [totals.netBeforeDeduction, settlingDoc.deductions]);

        const invoiceTotal = useMemo(() => {
          return netAfterDeduction + adjustmentsSum;
        }, [netAfterDeduction, adjustmentsSum]);

        const ensureDocSynced = () => {
          setSettlingDoc((prev) => ({
            ...prev,
            purchaseTotal: totals.shipAmount,
            returnTotal: totals.returnAmount,
          }));
        };

        const exportDetailsCSV = () => {
          const selectedSet = new Set(importState.selectedIds || []);
          const rawLines =
            (importState.settleLines || []).length > 0
              ? (importState.settleLines || [])
              : (importState.rawLines || []).filter((r) => selectedSet.has(r._id));

          const header1 = [
            "對帳單編號",
            "經銷商",
            "通知信箱",
            "發票日期",
            "扣款",
            "加減項合計",
            "淨額(扣款後)",
            "發票總額",
          ];
          const line1 = [
            settlingDoc.id,
            settlingDoc.channel,
            settlingDoc.notifyEmail || "",
            settlingDoc.invoiceDate || "",
            settlingDoc.issuer || "",
            safeNumber(settlingDoc.deductions),
            adjustmentsSum,
            netAfterDeduction,
            invoiceTotal,
          ]
            .map((x) => `"${String(x).replaceAll('"', '""')}"`)
            .join(",");

          const headerAdj = ["項目名稱", "金額(可正可負)"];
          const adjLines = (settlingDoc.adjustments || []).map((a) =>
            [a?.label || "", adjValue(a)]
              .map((x) => `"${String(x).replaceAll('"', '""')}"`)
              .join(",")
          );

          const headerSub = ["SKU", "商品名稱", "單價", "出貨數量", "退貨數量", "淨數量", "出貨金額", "退貨金額", "淨額", "備註"];
          const subLines = (importState.subtotals || []).map((r) =>
            [
              r.sku,
              r.skuName,
              safeNumber(r.unitPrice),
              safeNumber(r.shipQty),
              safeNumber(r.returnQty),
              safeNumber(r.netQty),
              safeNumber(r.shipAmount),
              safeNumber(r.returnAmount),
              safeNumber(r.netAmount),
              r.remark || "",
            ]
              .map((x) => `"${String(x).replaceAll('"', '""')}"`)
              .join(",")
          );

          const headerRaw = [
            "單據類型",
            "單號",
            "通路商簡稱",
            "通路商",
            "實際出貨日期",
            "實際入庫日期",
            "sku(品號)",
            "商品名稱",
            "單價",
            "原始數量",
            "剩餘可結(匯入時)",
            "本次結算數量",
            "小計金額(單價*本次數量)",
          ];
          const rawCsvLines = rawLines.map((r) => {
            const tracked = normalizeDocType(r.docType) === "出貨" || normalizeDocType(r.docType) === "退貨";
            return [
              r.docType,
              r.docNo,
              r.channelShort,
              r.channelFull,
              r.shipDate,
              r.inDate,
              r.sku,
              r.skuName,
              safeNumber(r.unitPrice),
              tracked ? safeNumber(r.originalQty) : safeNumber(r.qty),
              tracked ? safeNumber(r.availableQty) : "",
              safeNumber(r.qty),
              safeNumber(r.lineAmount),
            ]
              .map((x) => `"${String(x).replaceAll('"', '""')}"`)
              .join(",");
          });

          const blocks = [
            "## 對帳單資訊",
            header1.join(","),
            line1,
            "",
            "## 加減項",
            headerAdj.join(","),
            ...adjLines,
            "",
            "## SKU 小計",
            headerSub.join(","),
            ...subLines,
            "",
            "## 原始明細(已勾選)",
            headerRaw.join(","),
            ...rawCsvLines,
          ];

          const blob = new Blob([blocks.join("\n")], { type: "text/csv;charset=utf-8" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `對帳明細_${settlingDoc.id}_${new Date().toISOString().slice(0, 10)}.csv`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
        };

        return (
          <div className="animate-in fade-in slide-in-from-right-4 duration-300">
            <h2 className="text-lg font-bold mb-6 flex items-center gap-2">
              3. SKU 小計確認 → 模擬開立發票
            </h2>

            <div className="border border-gray-200 rounded-xl overflow-hidden mb-8 bg-white">
              <div className="bg-gray-50 px-5 py-3 text-sm text-gray-600 font-medium flex items-center justify-between gap-4">
                <div className="flex items-center gap-2">
                  <Icon name="calculator" className="w-4 h-4" />
                  小計明細（出貨/退貨可編輯「本次結算數量」≤ 剩餘可結；單價可調整）
                </div>
                <div className="text-xs text-gray-500">
                  {importState.confirmed ? "已確認（鎖定）" : "未確認（可編輯）"}
                </div>
              </div>
              <div className="overflow-auto max-h-[520px]">
                <table className="w-full text-left text-sm">
                  <thead className="bg-white text-gray-500 sticky top-0 z-10 border-b border-gray-100">
                    <tr>
                      <th className="px-4 py-3 font-medium">單據類型</th>
                      <th className="px-4 py-3 font-medium">狀態</th>
                      <th className="px-4 py-3 font-medium">單號</th>
                      <th className="px-4 py-3 font-medium">通路商簡稱</th>
                      <th className="px-4 py-3 font-medium">出貨日</th>
                      <th className="px-4 py-3 font-medium">入庫日</th>
                      <th className="px-4 py-3 font-medium">SKU</th>
                      <th className="px-4 py-3 font-medium">商品名稱</th>
                      <th className="px-4 py-3 font-medium">原始數量</th>
                      <th className="px-4 py-3 font-medium">剩餘可結</th>
                      <th className="px-4 py-3 font-medium">單價</th>
                      <th className="px-4 py-3 font-medium">本次結算數量</th>
                      <th className="px-4 py-3 font-medium">小計金額</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-gray-100">
                    {(importState.settleLines || []).map((r, idx) => (
                      <tr key={(r._id || "line") + "_" + idx} className="hover:bg-blue-50/30 transition-colors">
                        <td className="px-4 py-3">
                          <span
                            className={`inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium border ${
                              normalizeDocType(r.docType) === "退貨"
                                ? "bg-red-50 text-red-700 border-red-200"
                                : "bg-blue-50 text-blue-700 border-blue-200"
                            }`}
                          >
                            {normalizeDocType(r.docType) || "-"}
                          </span>
                        </td>
                        <td className="px-4 py-3 whitespace-nowrap">
                          <span className="inline-flex items-center px-2 py-1 rounded-md text-xs font-medium border border-slate-200 bg-slate-50 text-slate-700">
                            {partialSettlementStatusLabel(r)}
                          </span>
                        </td>
                        <td className="px-4 py-3 font-mono text-gray-900">{r.docNo || "-"}</td>
                        <td className="px-4 py-3 text-gray-700">{r.channelShort || "-"}</td>
                        <td className="px-4 py-3 text-gray-700">{r.shipDate || "-"}</td>
                        <td className="px-4 py-3 text-gray-700">{r.inDate || "-"}</td>
                        <td className="px-4 py-3 font-mono text-gray-800">{r.sku || "-"}</td>
                        <td className="px-4 py-3 text-gray-700">{r.skuName || "-"}</td>
                        <td className="px-4 py-3 text-gray-700">
                          {safeNumber(r.originalQty)}
                        </td>
                        <td className="px-4 py-3 text-blue-700 font-medium">
                          {(normalizeDocType(r.docType) === "出貨" || normalizeDocType(r.docType) === "退貨") ? safeNumber(r.availableQty) : "—"}
                        </td>
                        <td className="px-4 py-3">
                          <input
                            type="text"
                            inputMode="decimal"
                            value={
                              r.unitPrice === null || r.unitPrice === undefined
                                ? ""
                                : typeof r.unitPrice === "string"
                                ? r.unitPrice
                                : String(r.unitPrice)
                            }
                            disabled={importState.confirmed}
                            onChange={(e) => {
                              const t = e.target.value;
                              setImportState((prev) => {
                                const nextLines = (prev.settleLines || []).map((x) =>
                                  x._id === r._id
                                    ? {
                                        ...x,
                                        unitPrice: t,
                                        lineAmount:
                                          Math.abs(safeNumber(t)) * Math.abs(safeNumber(x.qty)),
                                      }
                                    : x
                                );
                                return {
                                  ...prev,
                                  settleLines: nextLines,
                                  subtotals: computeSubtotalsFromLines(nextLines),
                                };
                              });
                              ensureDocSynced();
                            }}
                            className="border border-gray-300 rounded px-2 py-1.5 text-sm w-28 text-right focus:outline-none focus:border-blue-500 disabled:bg-gray-100"
                          />
                        </td>
                        <td className="px-4 py-3">
                          <input
                            type="text"
                            inputMode="decimal"
                            value={
                              r.qty === null || r.qty === undefined
                                ? ""
                                : typeof r.qty === "string"
                                ? r.qty
                                : String(r.qty)
                            }
                            disabled={importState.confirmed}
                            onChange={(e) => {
                              const t = e.target.value;
                              setImportState((prev) => {
                                const nextLines = (prev.settleLines || []).map((x) => {
                                  if (x._id !== r._id) return x;
                                  let qtyVal = t;
                                  const dt = normalizeDocType(x.docType);
                                  if (dt === "出貨" || dt === "退貨") {
                                    const maxA = safeNumber(x.availableQty);
                                    const n = Math.abs(safeNumber(t));
                                    qtyVal = String(Math.min(maxA, Math.max(0, n)));
                                  }
                                  return {
                                    ...x,
                                    qty: qtyVal,
                                    lineAmount:
                                      Math.abs(safeNumber(x.unitPrice)) * Math.abs(safeNumber(qtyVal)),
                                  };
                                });
                                return {
                                  ...prev,
                                  settleLines: nextLines,
                                  subtotals: computeSubtotalsFromLines(nextLines),
                                };
                              });
                              ensureDocSynced();
                            }}
                            className="border border-gray-300 rounded px-2 py-1.5 text-sm w-24 text-right focus:outline-none focus:border-blue-500 disabled:bg-gray-100"
                          />
                        </td>
                        <td className="px-4 py-3 text-gray-900 font-medium">{formatMoney(r.lineAmount)}</td>
                      </tr>
                    ))}
                    {(importState.settleLines || []).length === 0 && (
                      <tr>
                        <td colSpan="13" className="px-6 py-10 text-center text-gray-500">
                          沒有小計資料（請回到上一步勾選單據）
                        </td>
                      </tr>
                    )}
                  </tbody>
                </table>
              </div>

              <div className="px-5 py-3 border-t border-gray-100 bg-white flex items-center justify-between gap-3">
                <div className="text-xs text-gray-600">
                  出貨：{formatMoney(totals.shipAmount)} ・退貨：-{formatMoney(totals.returnAmount).slice(1)} ・淨額：
                  <span className="font-semibold text-blue-600">
                    {formatMoney(netAfterDeduction)}
                  </span>
                </div>
                <div className="flex items-center gap-2">
                  <button
                    onClick={() => {
                      for (const ln of importState.settleLines || []) {
                        const dt = normalizeDocType(ln.docType);
                        if (dt !== "出貨" && dt !== "退貨") continue;
                        const q = Math.abs(safeNumber(ln.qty));
                        const maxA = safeNumber(ln.availableQty);
                        if (q <= 0 || q > maxA) {
                          alert(
                            `${dt} 單 ${ln.docNo || ""} / SKU ${ln.sku || ""}：本次結算數量須大於 0，且不可超過剩餘可結（${maxA}）。`
                          );
                          return;
                        }
                      }
                      ensureDocSynced();
                      setImportState((prev) => ({ ...prev, confirmed: true }));
                    }}
                    disabled={importState.confirmed || (importState.settleLines?.length || 0) === 0}
                    className="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 text-sm font-medium shadow-sm disabled:opacity-60 disabled:cursor-not-allowed"
                  >
                    確認小計
                  </button>
                </div>
              </div>
            </div>

            <div className="border border-gray-200 rounded-xl overflow-hidden mb-8 bg-white">
              <div className="bg-gray-50 px-5 py-3 text-sm text-gray-600 font-medium flex items-center justify-between gap-4">
                <div className="flex items-center gap-2">
                  <Icon name="plus-square" className="w-4 h-4" />
                  其他加減項（可新增多筆，金額可正可負）
                </div>
                <div className="text-xs text-gray-500">
                  加減項合計：{" "}
                  <span className={adjustmentsSum < 0 ? "text-red-600 font-semibold" : "text-gray-900 font-semibold"}>
                    {formatMoney(adjustmentsSum)}
                  </span>
                </div>
              </div>
              <div className="p-5">
                <div className="mb-4 border border-amber-200 bg-amber-50 text-amber-900 rounded-lg px-4 py-3 text-sm">
                  <div className="font-semibold">提醒：加減項會影響最後的發票總額</div>
                  <div className="mt-1 text-xs text-amber-800">
                    計算方式：發票總額 = 淨額（扣款後） {adjustmentsSum >= 0 ? "+" : "-"} 加減項合計（依你輸入的正負號）
                  </div>
                </div>
                <div className="space-y-3">
                  {(settlingDoc.adjustments || []).map((a) => (
                    <div key={a.id} className="grid grid-cols-1 md:grid-cols-12 gap-3 items-center">
                      <div className="md:col-span-7">
                        <input
                          type="text"
                          placeholder="項目名稱（例如：運費補貼、折讓、獎金...）"
                          value={a.label || ""}
                          onChange={(e) => {
                            const v = e.target.value;
                            setSettlingDoc((prev) => ({
                              ...prev,
                              adjustments: (prev.adjustments || []).map((x) => (x.id === a.id ? { ...x, label: v } : x)),
                            }));
                          }}
                          className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500"
                        />
                      </div>
                      <div className="md:col-span-4">
                        <input
                          type="text"
                          inputMode="decimal"
                          placeholder="金額（可正可負）"
                          value={String(a.amountText ?? (a.amount ?? ""))}
                          onChange={(e) => {
                            const text = e.target.value;
                            // 允許使用者先輸入 '-' 或小數點等中間狀態
                            if (!/^-?\d*(\.\d*)?$/.test(text)) return;
                            setSettlingDoc((prev) => ({
                              ...prev,
                              adjustments: (prev.adjustments || []).map((x) =>
                                x.id === a.id ? { ...x, amountText: text } : x
                              ),
                            }));
                          }}
                          className={`w-full border rounded-lg px-3 py-2 text-sm focus:outline-none ${
                            adjValue(a) < 0
                              ? "border-red-300 text-red-700 focus:border-red-500"
                              : "border-gray-300 text-gray-900 focus:border-blue-500"
                          }`}
                        />
                      </div>
                      <div className="md:col-span-1 flex md:justify-end">
                        <button
                          onClick={() => {
                            setSettlingDoc((prev) => ({
                              ...prev,
                              adjustments: (prev.adjustments || []).filter((x) => x.id !== a.id),
                            }));
                          }}
                          className="px-3 py-2 border border-gray-300 rounded-lg text-sm text-gray-700 hover:bg-gray-50"
                        >
                          刪除
                        </button>
                      </div>
                    </div>
                  ))}

                  {(settlingDoc.adjustments || []).length === 0 && (
                    <div className="text-sm text-gray-500 border border-dashed border-gray-300 rounded-lg p-4 bg-gray-50">
                      尚未新增加減項（可選）
                    </div>
                  )}
                </div>

                <div className="pt-4 flex items-center justify-between gap-3">
                  <div className="text-xs text-gray-500">
                    規則：以淨額（扣款後）為基礎，再加上所有加減項 → 發票總額
                  </div>
                  <button
                    onClick={() => {
                      const id = `ADJ-${Date.now()}-${Math.floor(Math.random() * 1000)}`;
                      setSettlingDoc((prev) => ({
                        ...prev,
                        adjustments: [...(prev.adjustments || []), { id, label: "", amountText: "", amount: 0 }],
                      }));
                    }}
                    className="px-4 py-2 bg-white border border-gray-300 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-50"
                  >
                    + 新增加減項
                  </button>
                </div>
              </div>
            </div>

            <div className="border border-gray-200 rounded-lg overflow-hidden mb-8">
              <table className="w-full text-left text-sm">
                <thead className="bg-gray-50 text-gray-500">
                  <tr>
                    <th className="px-4 py-3 font-medium">對帳單編號</th>
                    <th className="px-4 py-3 font-medium">通路商</th>
                    <th className="px-4 py-3 font-medium text-blue-600">發票總額</th>
                    <th className="px-4 py-3 font-medium">
                      發票號碼 <span className="text-red-500">*</span>
                    </th>
                    <th className="px-4 py-3 font-medium">通知信箱（ezpay）</th>
                    <th className="px-4 py-3 font-medium">發票日期</th>
                    <th className="px-4 py-3 font-medium">開立人</th>
                    <th className="px-4 py-3 font-medium">備註</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-gray-100">
                  <tr>
                    <td className="px-4 py-4 text-gray-900">{settlingDoc.id}</td>
                    <td className="px-4 py-4 text-gray-900">{settlingDoc.channel}</td>
                    <td className="px-4 py-4">
                      <div className="text-blue-600 font-semibold text-base">{formatMoney(invoiceTotal)}</div>
                      <div className="mt-1 text-xs text-gray-500">
                        淨額（扣款後）{formatMoney(netAfterDeduction)} {adjustmentsSum >= 0 ? "+" : "-"} 加減項
                        {formatMoney(Math.abs(adjustmentsSum))} = {formatMoney(invoiceTotal)}
                      </div>
                    </td>
                    <td className="px-4 py-4">
                      <div className="bg-gray-100 text-gray-400 italic px-3 py-1.5 rounded text-xs border border-gray-200 inline-block">
                        (系統將自動配號)
                      </div>
                    </td>
                    <td className="px-4 py-4">
                      <input
                        type="email"
                        placeholder="name@example.com"
                        value={settlingDoc.notifyEmail || ""}
                        onChange={(e) =>
                          setSettlingDoc((prev) => ({ ...prev, notifyEmail: e.target.value }))
                        }
                        className="border border-gray-300 rounded px-3 py-1.5 text-sm w-56 focus:outline-none focus:border-blue-500"
                      />
                    </td>
                    <td className="px-4 py-4">
                      <input
                        type="date"
                        value={settlingDoc.invoiceDate}
                        onChange={(e) =>
                          setSettlingDoc((prev) => ({ ...prev, invoiceDate: e.target.value }))

                        className="border border-gray-300 rounded px-2 py-1.5 text-sm w-36 focus:outline-none focus:border-blue-500"
                      />
                    </td>
                    <td className="px-4 py-4 text-gray-600">{settlingDoc.issuer}</td>
                    <td className="px-4 py-4">

    <script>
      const data = ${JSON.stringify(previewData).replaceAll("</", "<\\/")};

      const safeNumber = (v) => {
        if (v === null || v === undefined) return 0;
        if (typeof v === 'number') return Number.isFinite(v) ? v : 0;
        const s = String(v).trim();
        if (!s) return 0;
        const cleaned = s
          .replace(/[$,\s]/g, '')
          .replace(/^--+/, '-')
          .replace(/[^0-9.+-]/g, '');
        const n = Number(cleaned);
        return Number.isFinite(n) ? n : 0;
      };
      const normalizeDocType = (v) => {
        const s = String(v || '').trim();
        if (!s) return '';
        if (s.includes('退')) return '退貨';
        if (s.includes('出')) return '出貨';
        return s;
      };
      const computeSubtotalsFromLines = (lines) => {
        const map = new Map();
        for (const r of (lines || [])) {
          const sku = r.sku || '';
          if (!sku) continue;
          const docType = normalizeDocType(r.docType);
          const qty = safeNumber(r.qty);
          const unitPrice = Math.abs(safeNumber(r.unitPrice));
          const amt = unitPrice * Math.abs(qty);
          const prev = map.get(sku) || {
            sku,
            skuName: r.skuName || '',
            unitPrice: safeNumber(r.unitPrice),
            shipQty: 0,
            returnQty: 0,
            shipAmount: 0,
            returnAmount: 0,
            remark: '',
          };
          if (!prev.skuName && r.skuName) prev.skuName = r.skuName;
          if (!prev.unitPrice && safeNumber(r.unitPrice)) prev.unitPrice = safeNumber(r.unitPrice);
          const isReturn = docType === '退貨' || qty < 0;
          if (isReturn) {
            prev.returnQty += Math.abs(qty);
            prev.returnAmount += Math.abs(amt);
          } else {
            prev.shipQty += Math.abs(qty);
            prev.shipAmount += Math.abs(amt);
          }
          map.set(sku, prev);
        }
        const out = Array.from(map.values()).map((r) => ({
          ...r,
          netQty: safeNumber(r.shipQty) - safeNumber(r.returnQty),
          netAmount: safeNumber(r.shipAmount) - safeNumber(r.returnAmount),
        }));
        out.sort((a, b) => String(a.sku).localeCompare(String(b.sku), 'en'));
        return out;
      };

      } else {
        badge.className = 'mt-1 inline-flex items-center px-3 py-1 rounded-full text-sm font-medium border bg-green-100 text-green-700 border-green-200';
      }

      const vb = document.getElementById('viewOnlyBanner');
      if (vb) vb.classList.toggle('hidden', !viewOnly);
      const modeBadge = document.getElementById('modeBadge');
      if (modeBadge) modeBadge.classList.toggle('hidden', !viewOnly);
      const linesTitle = document.getElementById('linesSectionTitle');

      const linesHint = document.getElementById('linesSectionHint');

      const adjTitle = document.getElementById('adjSectionTitle');

      const addAdjBtn = document.getElementById('addAdjBtn');
      if (addAdjBtn) addAdjBtn.classList.toggle('hidden', viewOnly);
      const adjThOp = document.getElementById('adjThOp');
      if (adjThOp) adjThOp.classList.toggle('hidden', viewOnly);

      document.getElementById('invoiceNo').textContent = data.invoiceNo || '-';
      document.getElementById('invoiceDate').textContent = data.invoiceDate || '-';
      document.getElementById('issuer').textContent = data.issuer || '-';
      const notifyEmailEl = document.getElementById('notifyEmail');
      const noteEl = document.getElementById('note');
      const deductionsEl = document.getElementById('deductions');
      notifyEmailEl.value = data.notifyEmail || '';
      noteEl.value = data.note || '';
      if (viewOnly) {
        notifyEmailEl.readOnly = true;
        notifyEmailEl.tabIndex = -1;
        notifyEmailEl.classList.add('bg-gray-50', 'text-gray-800', 'cursor-default');
        noteEl.readOnly = true;
        noteEl.tabIndex = -1;
        noteEl.classList.add('bg-gray-50', 'text-gray-800', 'cursor-default');
      }
      const fixedDeductions = safeNumber(data.deductions || 0);
      deductionsEl.textContent = String(fixedDeductions);

      const saveBtn = document.getElementById('saveBtn');
      const issueBtn = document.getElementById('issueBtn');
      const closeBtn = document.getElementById('closeBtn');
      if (viewOnly) {
        if (saveBtn) saveBtn.classList.add('hidden');
        if (issueBtn) issueBtn.classList.add('hidden');
        if (closeBtn) {
          closeBtn.classList.remove('hidden');
          closeBtn.addEventListener('click', () => { try { window.close(); } catch (e) {} });
        }
      }

      let showAllLines = false;
      let showAllSku = false;
      const toggleLinesBtn = document.getElementById('toggleLinesBtn');
      const toggleSkuBtn = document.getElementById('toggleSkuBtn');
      if (toggleLinesBtn) {
        toggleLinesBtn.addEventListener('click', () => {
          showAllLines = !showAllLines;
          toggleLinesBtn.textContent = showAllLines ? '收合' : '展開全部';
          recalcAndRender();
        });
      }
      if (toggleSkuBtn) {
        toggleSkuBtn.addEventListener('click', () => {
          showAllSku = !showAllSku;
          toggleSkuBtn.textContent = showAllSku ? '收合' : '展開全部';
          recalcAndRender();
        });
      }

      let lines = (data.rawLines || []).map((r, i) => ({
        _id: r._id || String(i + 1),
        docType: r.docType || r['單據類型'] || '',
        docNo: r.docNo || r['單號'] || '',
        channelShort: r.channelShort || r['通路商簡稱'] || '',
        channelFull: r.channelFull || r.channelName || r['通路商'] || '',
        channelName: r.channelName || r['通路商'] || '',
        shipDateISO: r.shipDateISO || r['實際出貨日期'] || '',
        shipDate: r.shipDate || '',
        inDateISO: r.inDateISO || r['實際入庫日期'] || '',
        inDate: r.inDate || '',
        sku: r.sku || r['sku(品號)'] || '',
        skuName: r.skuName || r['商品名稱'] || '',
        unitPrice: safeNumber(r.unitPrice ?? r['單價']),
        qty: safeNumber(r.qty ?? r['數量']),
        lineAmount: safeNumber(r.lineAmount ?? r['小計金額']),
        originalQty: safeNumber(r.originalQty != null ? r.originalQty : r.qty),
        priorSettledQty: safeNumber(r.priorSettledQty),
        availableQty: safeNumber(r.availableQty),
        settlementKey: String(r.settlementKey || ''),
      }));

      const renderLines = () => {
        const tbody = document.getElementById('linetbody');
        tbody.innerHTML = '';
        const view = showAllLines ? lines : lines.slice(0, 5);
        for (const r of view) {
          const tr = document.createElement('tr');
          const td = (cls, text) => {
            const el = document.createElement('td');
            el.className = cls;
            el.textContent = text;
            return el;
          };
          tr.appendChild(td('px-5 py-3 whitespace-nowrap', normalizeDocType(r.docType)));
          tr.appendChild(td('px-5 py-3 whitespace-nowrap font-mono', String(r.docNo || '')));
          tr.appendChild(td('px-5 py-3 whitespace-nowrap', String(r.channelShort || '')));
          tr.appendChild(td('px-5 py-3 whitespace-nowrap', String(r.shipDateISO || '')));
          tr.appendChild(td('px-5 py-3 whitespace-nowrap', String(r.inDateISO || '')));
          tr.appendChild(td('px-5 py-3 whitespace-nowrap font-mono', String(r.sku || '')));
          tr.appendChild(td('px-5 py-3', String(r.skuName || '')));

          const mkReadonlyInput = (widthCls, val) => {
            const el = document.createElement('input');
            el.readOnly = true;
            el.tabIndex = -1;
            el.className =
              'border border-gray-300 rounded px-2 py-1 text-sm ' +
              widthCls +
              ' text-right bg-gray-50 text-gray-800 cursor-default';
            el.value = String(val ?? '');
            el.setAttribute('inputmode', 'decimal');
            return el;
          };

          if (viewOnly) {
            const tdPrice = document.createElement('td');

            tdPrice.appendChild(mkReadonlyInput('w-28', r.unitPrice ?? ''));
            tr.appendChild(tdPrice);
            const tdQty = document.createElement('td');
            tdQty.className = 'px-5 py-2 whitespace-nowrap text-right';
            tdQty.appendChild(mkReadonlyInput('w-20', r.qty ?? ''));
            tr.appendChild(tdQty);
          } else {
            const tdPrice = document.createElement('td');
            tdPrice.className = 'px-5 py-2 whitespace-nowrap text-right';
            const ip = document.createElement('input');
            ip.className = 'border border-gray-300 rounded px-2 py-1 text-sm w-28 text-right focus:outline-none focus:border-blue-500';
            ip.value = String(r.unitPrice ?? '');
            ip.setAttribute('inputmode', 'decimal');
            ip.addEventListener('input', (e) => {
              r.unitPrice = safeNumber(e.target.value);
              r.lineAmount = Math.abs(safeNumber(r.unitPrice)) * Math.abs(safeNumber(r.qty));
              const trEl = e.target.closest('tr');
              if (trEl) {
                const cells = trEl.querySelectorAll('td');
                const last = cells[cells.length - 1];
                if (last) last.textContent = fmtMoney(r.lineAmount || 0);
              }
              refreshFinancials();
            });
            tdPrice.appendChild(ip);
            tr.appendChild(tdPrice);

            const tdQty = document.createElement('td');
            tdQty.className = 'px-5 py-2 whitespace-nowrap text-right';
            const iq = document.createElement('input');
            iq.className = 'border border-gray-300 rounded px-2 py-1 text-sm w-20 text-right focus:outline-none focus:border-blue-500';
            iq.value = String(r.qty ?? '');
            iq.setAttribute('inputmode', 'decimal');
            iq.addEventListener('input', (e) => {
              let qv = safeNumber(e.target.value);
              if (normalizeDocType(r.docType) === '出貨' || normalizeDocType(r.docType) === '退貨') {
                const maxA = safeNumber(r.availableQty);
                qv = Math.min(maxA, Math.max(0, Math.abs(qv)));
                iq.value = String(qv);
              }
              r.qty = qv;
              r.lineAmount = Math.abs(safeNumber(r.unitPrice)) * Math.abs(safeNumber(r.qty));
              const trEl = e.target.closest('tr');
              if (trEl) {
                const cells = trEl.querySelectorAll('td');
                const last = cells[cells.length - 1];
                if (last) last.textContent = fmtMoney(r.lineAmount || 0);
              }
              refreshFinancials();
            });
            tdQty.appendChild(iq);
            tr.appendChild(tdQty);
          }

          tr.appendChild(td('px-5 py-3 whitespace-nowrap text-right font-medium', fmtMoney(r.lineAmount || 0)));
          tbody.appendChild(tr);
        }
      };

      const renderSubtotals = (subs) => {
        const tbody = document.getElementById('subtbody');
        tbody.innerHTML = '';
        const rows = subs || [];
        const view = showAllSku ? rows : rows.slice(0, 5);
        for (const r of view) {
          const tr = document.createElement('tr');
          const cells = [
            String(r.sku || ''),
            String(r.skuName || ''),
            String(r.shipQty ?? ''),
            String(r.returnQty ?? ''),
            String(r.netQty ?? ''),
            fmtMoney(r.netAmount || 0),
            String(r.remark || ''),
          ];
          cells.forEach((c, idx) => {
            const td = document.createElement('td');
            td.className =
              'px-5 py-3' +
              (idx === 0 ? ' font-mono' : '') +
              (r.__isAdj ? (idx === 0 || idx === 1 ? ' bg-amber-50' : '') : '') +
              (idx === 3 && safeNumber(r.returnQty) !== 0 ? ' text-red-600' : '') +
              (idx === 4 || idx === 5 ? ' text-blue-600 font-semibold' : '');
            td.textContent = c;
            tr.appendChild(td);
          });
          tbody.appendChild(tr);
        }
      };

      // 調整項目（可增刪修）
      let adjustments = (data.adjustments || []).map((a, idx) => ({
        id: String(a?.id || ('adj_' + (idx + 1))),
        label: String(a?.label || a?.sku || a?.name || a?.skuName || '').trim(),
        amountText: String(a?.amountText ?? a?.amount ?? '').trim(),
      }));

      const renderAdjustments = () => {
        const tbody = document.getElementById('adjtbody');
        if (!tbody) return;
        tbody.innerHTML = '';
        if (adjustments.length === 0) {
          const tr = document.createElement('tr');
          const td = document.createElement('td');
          td.colSpan = viewOnly ? 2 : 3;
          td.className = 'py-4 text-gray-500 text-sm';
          td.textContent = viewOnly ? '（無調整項目）' : '尚未新增調整項目';
          tr.appendChild(td);
          tbody.appendChild(tr);
          return;
        }
        for (const a of adjustments) {
          const tr = document.createElement('tr');

          if (viewOnly) {
            const tdSku = document.createElement('td');
            tdSku.className = 'py-2 pr-3';
            const inSkuRo = document.createElement('input');
            inSkuRo.readOnly = true;
            inSkuRo.tabIndex = -1;
            inSkuRo.className = 'border border-gray-300 rounded px-2 py-1 text-sm w-full bg-gray-50 text-gray-800 cursor-default';
            inSkuRo.value = a.label || '';
            tdSku.appendChild(inSkuRo);
            tr.appendChild(tdSku);
            const tdAmt = document.createElement('td');
            tdAmt.className = 'py-2 pr-3 text-right';
            const inAmtRo = document.createElement('input');
            inAmtRo.readOnly = true;
            inAmtRo.tabIndex = -1;
            inAmtRo.className = 'border border-gray-300 rounded px-2 py-1 text-sm w-40 text-right bg-gray-50 text-gray-800 cursor-default';
            inAmtRo.value = a.amountText || String(safeNumber(a.amount ?? 0));
            tdAmt.appendChild(inAmtRo);
            tr.appendChild(tdAmt);
          } else {
            const tdSku = document.createElement('td');
            tdSku.className = 'py-2 pr-3';
            const inSku = document.createElement('input');
            inSku.className = 'border border-gray-300 rounded px-2 py-1 text-sm w-full focus:outline-none focus:border-blue-500';
            inSku.placeholder = '例如：折讓 / 平台費 / 促銷補貼';
            inSku.value = a.label || '';
            inSku.addEventListener('input', (e) => { a.label = e.target.value; refreshFinancials(); });
            tdSku.appendChild(inSku);
            tr.appendChild(tdSku);

            const tdAmt = document.createElement('td');
            tdAmt.className = 'py-2 pr-3 text-right';
            const inAmt = document.createElement('input');
            inAmt.className = 'border border-gray-300 rounded px-2 py-1 text-sm w-40 text-right focus:outline-none focus:border-blue-500';
            inAmt.placeholder = '可輸入負數';
            inAmt.value = a.amountText || '';
            inAmt.type = 'text';
            inAmt.setAttribute('inputmode', 'decimal');
            inAmt.addEventListener('input', (e) => { a.amountText = e.target.value; refreshFinancials(); });
            tdAmt.appendChild(inAmt);
            tr.appendChild(tdAmt);

            const tdOp = document.createElement('td');
            tdOp.className = 'py-2 pr-3 text-right';
            const del = document.createElement('button');
            del.className = 'text-sm px-3 py-1 rounded border border-gray-300 hover:bg-gray-100';
            del.textContent = '刪除';
            del.addEventListener('click', () => {
              adjustments = adjustments.filter((x) => x.id !== a.id);
              recalcAndRender();
            });
            tdOp.appendChild(del);
            tr.appendChild(tdOp);
          }

          tbody.appendChild(tr);
        }
      };

      const addAdjBtnEl = document.getElementById('addAdjBtn');
      if (addAdjBtnEl && !viewOnly) {
        addAdjBtnEl.addEventListener('click', () => {
          const id = 'adj_' + Date.now() + '_' + Math.random().toString(16).slice(2);
          adjustments = [...adjustments, { id, label: '', name: '', amountText: '' }];
          recalcAndRender();
        });
      }

      const refreshFinancials = () => {
        const subs = computeSubtotalsFromLines(lines);
        const ship = sumMoney(subs, (x) => x.shipAmount);
        const ret = sumMoney(subs, (x) => x.returnAmount);
        const baseNet = ship - ret;
        const deductions = fixedDeductions;
        const adjSum = (adjustments || []).reduce((acc, a) => acc + safeNumber(a?.amountText ?? a?.amount), 0);
        const invoiceTotal = (baseNet - deductions) + adjSum;

        document.getElementById('shipTotal').textContent = fmtMoney(ship);
        document.getElementById('returnTotal').textContent = '-' + fmtMoney(ret).replace(/^-\\$?/, '');
        document.getElementById('baseNet').textContent = fmtMoney(baseNet);
        document.getElementById('adjSum').textContent = (adjSum >= 0 ? '+' : '') + fmtMoney(adjSum).replace('$-', '-$');
        document.getElementById('amount').textContent = fmtMoney(invoiceTotal);

        const adjRows = (adjustments || []).map((a) => {
          const label = String(a.label || '').trim();
          return {
            sku: label,
            skuName: label,
          shipQty: 1,
          returnQty: 0,
          netQty: 1,
          netAmount: safeNumber(a.amountText ?? 0),
          remark: '調整項目',
          __isAdj: true,
          };
        }).filter((r) => r.sku || safeNumber(r.netAmount) !== 0);

        renderSubtotals([...subs, ...adjRows]);
        return { subs, ship, ret, baseNet, deductions, adjSum, invoiceTotal, adjRows };
      };

      const recalcAndRender = () => {
        const r = refreshFinancials();
        renderLines();
        renderAdjustments();
        return r;
      };

      // 初次渲染：以最新 lines 重新算（避免與舊 subtotals 不同步）
      recalcAndRender();

      const buildPayload = () => {
        const r = recalcAndRender();
        return {
          payload: { rawLines: lines, subtotals: r.subs, periodStart: (data.periodStart || ''), periodEnd: (data.periodEnd || '') },
          amount: r.invoiceTotal,
          deductions: r.deductions,
        };
      };

      const sendSave = () => {
        if (!window.opener) { alert('找不到主視窗'); return false; }
        const built = buildPayload();
        window.opener.postMessage({
          type: 'DAS_SAVE_DRAFT',
          id: data.id,
          payload: built.payload,
          amount: built.amount,
          deductions: built.deductions,
          adjustments: adjustments || [],
          notifyEmail: notifyEmailEl.value || '',
          note: noteEl.value || '',
        }, '*');
        return true;
      };
      if (!viewOnly) {
        if (saveBtn) {
          saveBtn.addEventListener('click', () => {
            const ok = sendSave();
            if (!ok) return;
            saveBtn.disabled = true;
            const t = saveBtn.textContent;
            saveBtn.textContent = '已送出...';
            setTimeout(() => { saveBtn.disabled = false; saveBtn.textContent = t; }, 1200);
          });
        }
        if (issueBtn) {
          issueBtn.addEventListener('click', () => {
            if (!window.opener) { alert('找不到主視窗'); return; }
            const built = buildPayload();
            window.opener.postMessage({
              type: 'DAS_ISSUE_INVOICE_WITH_DATA',
              id: data.id,
              payload: built.payload,
              amount: built.amount,
              deductions: built.deductions,
              adjustments: adjustments || [],
              notifyEmail: notifyEmailEl.value || '',
              note: noteEl.value || '',
            }, '*');
            issueBtn.disabled = true;
            issueBtn.textContent = '已送出...';
          });
        }
      }
      window.addEventListener('message', (e) => {
        if (e?.data?.type === 'DAS_SAVE_DRAFT_DONE' && e?.data?.id === data.id) {
          // no-op
        }
        if (e?.data?.type === 'DAS_ISSUE_INVOICE_DONE' && e?.data?.id === data.id) {
          alert('已開立發票完成（主視窗已更新）');
          window.close();
        }
      });
    ${"</scr" + "ipt>"}
  </body>
</html>`;
                              const w = window.open("", "_blank");
                              if (!w) {
                                alert("瀏覽器阻擋開新分頁，請允許彈出視窗後再試一次。");
                                return;
                              }
                              w.document.open();
                              w.document.write(html);
                              w.document.close();
                            }}
                            className="text-blue-600 hover:text-blue-800 font-medium text-sm"
                          >
                            {row.status === "草稿" ? "檢視/編輯" : "檢視"}
                          </button>
                        </div>
                      </td>
                    </tr>
                  ))}
                  {filtered.length === 0 && (
                    <tr>
                      <td colSpan="8" className="px-6 py-10 text-center text-gray-500">
                        沒有符合條件的資料
                      </td>
                    </tr>
                  )}
                </tbody>
              </table>
            </div>

            <div className="px-6 py-4 border-t border-gray-100 bg-white flex items-center justify-between text-sm text-gray-500">
              <div>顯示 1 到 {Math.min(filtered.length, filtered.length)} 筆，共 {filtered.length} 筆</div>
              <div className="flex gap-1">
                <button className="px-3 py-1 border border-gray-200 rounded hover:bg-gray-50 disabled:opacity-50" disabled>
                  上一頁
                </button>
                <button className="px-3 py-1 bg-blue-50 text-blue-600 font-medium border border-blue-100 rounded">
                  1
                </button>
                <button className="px-3 py-1 border border-gray-200 rounded hover:bg-gray-50 disabled:opacity-50" disabled>
                  下一頁
                </button>
              </div>
            </div>
          </div>
        );
      }

      function ClosedView({ doc, onBackToList, onBackToSettling }) {
        const [isExpanded, setIsExpanded] = useState(false);

        const finance = useMemo(() => {
          const ship = (doc.subtotals || []).reduce((acc, r) => acc + safeNumber(r.shipAmount), 0);
          const ret = (doc.subtotals || []).reduce((acc, r) => acc + safeNumber(r.returnAmount), 0);
          const baseNet = ship - ret;
          const deductions = safeNumber(doc.deductions);
          const adjSum = (doc.adjustments || []).reduce((acc, a) => acc + safeNumber(a?.amountText ?? a?.amount), 0);
          const netAfterDeduction = baseNet - deductions;
          const invoiceTotal = netAfterDeduction + adjSum;
          return { ship, ret, baseNet, deductions, adjSum, netAfterDeduction, invoiceTotal };
        }, [doc.subtotals, doc.deductions, doc.adjustments]);

        const visibleSubtotals = useMemo(() => {
          const rows = doc.subtotals || [];
          if (isExpanded) return rows;
          return rows.slice(0, 5);
        }, [doc.subtotals, isExpanded]);

        const csvForDoc = () => {
          const header = [
            "單據類型",
            "單號",
            "通路商簡稱",
            "通路商",
            "實際出貨日期",
            "實際入庫日期",
            "sku(品號)",
            "商品名稱",
            "單價",
            "數量",
            "小計金額",
          ];
          const lines = [
            header.join(","),
            ...(doc.rawLines || []).map((r) =>
              [
                r.docType,
                r.docNo,
                r.channelShort,
                r.channel,
                r.shipDate,
                r.inDate,
                r.sku,
                r.skuName,
                r.unitPrice,
                r.qty,
                r.lineAmount,
              ]
                .map((x) => `"${String(x).replaceAll('"', '""')}"`)
                .join(",")
            ),
          ];
          const blob = new Blob([lines.join("\n")], { type: "text/csv;charset=utf-8" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `結案明細_${doc.id}_${new Date().toISOString().slice(0, 10)}.csv`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
        };

        return (
          <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <div className="p-6 border-b border-gray-100 flex items-start justify-between gap-6">
              <div className="min-w-0">

                  </h2>
                  <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-gray-900 text-white">
                    <Icon name="lock" className="w-3 h-3" />
                    {doc.status}
                  </span>
                  <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-green-100 text-green-700 border border-green-200">
                    <Icon name="check" className="w-3 h-3" />
                    已開立發票 / 已回壓
                  </span>
                </div>
                <p className="text-sm text-gray-500 mt-2 truncate">
                  {doc.channel} ・結算期間：{doc.shipDateRange} ・結案後資料鎖定不可修改（可匯出/列印/查詢）
                </p>
              </div>

              <div className="flex items-center gap-2 shrink-0">
                <button
                  onClick={csvForDoc}
                  className="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 text-sm font-medium shadow-sm flex items-center gap-2"
                >
                  <Icon name="file-down" className="w-4 h-4" />
                  匯出明細
                </button>
              </div>
            </div>

            <div className="p-6">
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <div className="border border-gray-200 rounded-xl p-5 bg-gray-50">
                  <div className="text-sm text-gray-500">發票資訊</div>
                  <div className="mt-3 space-y-2 text-sm text-gray-800">
                        <div className="flex justify-between gap-4">
                      <span className="text-gray-500">發票號碼</span>
                      <span className="font-mono font-medium">{doc.invoiceNo || "-"}</span>
                        </div>
                        <div className="flex justify-between gap-4">
                      <span className="text-gray-500">發票日期</span>
                      <span className="font-medium">{doc.invoiceDate || "-"}</span>
                        </div>
                        <div className="flex justify-between gap-4">
                      <span className="text-gray-500">開立人</span>
                      <span className="font-medium">{doc.issuer || "-"}</span>
                        </div>
                      </div>
                    </div>

                <div className="border border-gray-200 rounded-xl p-5">
                  <div className="text-sm text-gray-500">財務結算卡</div>
                  <div className="mt-2 text-2xl font-extrabold text-blue-600">
                    {formatMoney(finance.netAfterDeduction)}
                        </div>
                  <div className="mt-1 text-xs text-gray-500">本期應收（Net）總額（商品淨額，扣款後）</div>
                  <div className="mt-4 grid grid-cols-2 gap-3 text-sm">
                    <div className="border border-gray-200 rounded-lg p-3">
                      <div className="text-xs text-gray-500">出貨總計</div>
                      <div className="mt-1 font-semibold text-gray-900">{formatMoney(finance.ship)}</div>
                        </div>
                    <div className="border border-gray-200 rounded-lg p-3">
                      <div className="text-xs text-gray-500">退貨總計</div>
                      <div className="mt-1 font-semibold text-red-600">-{formatMoney(finance.ret).slice(1)}</div>
                        </div>
                    <div className="border border-gray-200 rounded-lg p-3">
                      <div className="text-xs text-gray-500">扣款</div>
                      <div className="mt-1 font-semibold text-red-600">-{formatMoney(finance.deductions).slice(1)}</div>
                      </div>
                    <div className="border border-gray-200 rounded-lg p-3">
                      <div className="text-xs text-gray-500">調整項目（加減項合計）</div>
                      <div className={`mt-1 font-semibold ${finance.adjSum < 0 ? "text-red-600" : "text-gray-900"}`}>
                        {formatMoney(finance.adjSum)}
                    </div>
                  </div>
                </div>
                </div>
              </div>

              <div className="border border-gray-200 rounded-xl overflow-hidden">
                  <div className="bg-gray-50 px-5 py-3 text-sm text-gray-600 font-medium flex items-center gap-2">
                    <Icon name="calculator" className="w-4 h-4" />
                  Net 小計
                  </div>
                  <div className="overflow-auto">
                    <table className="w-full text-left text-sm">
                      <thead className="bg-white text-gray-500 sticky top-0 z-10 border-b border-gray-100">
                        <tr>
                        <th className="px-5 py-3 font-medium">通路商簡稱</th>
                          <th className="px-5 py-3 font-medium">SKU</th>
                          <th className="px-5 py-3 font-medium">商品名稱</th>
                          <th className="px-5 py-3 font-medium">出貨數量</th>
                          <th className="px-5 py-3 font-medium">退貨數量</th>
                          <th className="px-5 py-3 font-medium text-blue-600">淨數量</th>
                          <th className="px-5 py-3 font-medium">出貨金額</th>
                          <th className="px-5 py-3 font-medium">退貨金額</th>
                          <th className="px-5 py-3 font-medium text-blue-600">淨額</th>
                          <th className="px-5 py-3 font-medium">備註</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-gray-100">
                      {visibleSubtotals.map((r, idx) => (
                          <tr key={r.sku + "_" + idx} className="hover:bg-blue-50/30 transition-colors">
                          <td className="px-5 py-3 text-gray-800">{r.channelShort || doc.channel || r.channel}</td>
                            <td className="px-5 py-3 font-mono text-gray-800">{r.sku}</td>
                            <td className="px-5 py-3 text-gray-700">{r.skuName}</td>
                            <td className="px-5 py-3 text-gray-700">{r.shipQty}</td>
                            <td className="px-5 py-3 text-red-600">{r.returnQty}</td>
                            <td className="px-5 py-3 text-blue-600 font-semibold">{r.netQty}</td>
                            <td className="px-5 py-3 text-gray-700">{formatMoney(r.shipAmount)}</td>
                            <td className="px-5 py-3 text-red-600">-{formatMoney(r.returnAmount).slice(1)}</td>
                            <td className="px-5 py-3 text-blue-600 font-semibold">{formatMoney(r.netAmount)}</td>
                            <td className="px-5 py-3">
                              <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-green-100 text-green-700 border border-green-200">
                                <Icon name="check" className="w-3 h-3" />
                                {r.remark}
                              </span>
                            </td>
                          </tr>
                        ))}
                        {(!doc.subtotals || doc.subtotals.length === 0) && (
                          <tr>
                            <td colSpan="10" className="px-6 py-10 text-center text-gray-500">
                            沒有小計資料
                            </td>
                          </tr>
                        )}
                      </tbody>
                    </table>
                  </div>
                {(doc.subtotals || []).length > 5 && (
                  <div className="px-5 py-3 border-t border-gray-100 bg-white flex items-center justify-between">
                    <div className="text-xs text-gray-500">
                      目前顯示 {isExpanded ? (doc.subtotals || []).length : 5} / {(doc.subtotals || []).length} 列
                </div>
                    <button
                      onClick={() => setIsExpanded((v) => !v)}
                      className="text-sm font-medium text-blue-600 hover:text-blue-800"
                    >
                      {isExpanded ? "收合" : "展開全部"}
                    </button>
                </div>
              )}
              </div>

            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
